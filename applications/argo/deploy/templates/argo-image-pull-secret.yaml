{{- if .Values.registry.secret.name }}
{{- $argo := index .Subcharts "argo-workflows" }}
# Emissary needs this secret to resolve default commands in CloudHarness task images.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argo-workflows.controller.fullname" $argo }}-registry
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.registry.secret.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argo-workflows.controller.fullname" $argo }}-registry
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "argo-workflows.controller.fullname" $argo }}-registry
subjects:
  - kind: ServiceAccount
    name: {{ include "argo-workflows.controllerServiceAccountName" $argo }}
    namespace: {{ .Release.Namespace }}
{{- end }}
