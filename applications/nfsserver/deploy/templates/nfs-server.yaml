apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-exports
  labels:
    app: nfs-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.apps.nfsserver.server.diskSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  labels:
    app: nfs-server
    usesvolume: nfs-exports
spec:
  # Recreate strategy: with an RWO PVC, a surge pod can never attach while the
  # old pod holds nfs-exports, so RollingUpdate would deadlock. Single-replica
  # by design.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-server
  template:

    metadata:
      labels:
        app: nfs-server
        usesvolume: nfs-exports
    spec:
      serviceAccountName: {{ template "nfs-subdir-external-provisioner.serviceAccountName" . }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: usesvolume
                    operator: In
                    values:
                      - nfs-exports
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: nfs-server
        image: {{ .Values.apps.nfsserver.harness.deployment.image }}
        imagePullPolicy: IfNotPresent
        env:
        # NFS useDNS {{ .Values.apps.nfsserver.nfs.useDNS }}
        {{- if .Values.apps.nfsserver.nfs.useDNS }}
        - name: NFS_SERVER
          value: {{ printf "nfs-server.%s.svc.cluster.local" .Values.namespace }}
        {{- end }}
        - name: NFS_PATH
          value: {{ .Values.apps.nfsserver.nfs.path }}
        - name: PROVISIONER_NAME
          value: {{ printf "%s-nfs-provisioner" .Values.namespace }}
        # Single-replica Deployment backed by an RWO PVC — only one pod can
        # ever mount /exports, so leader election is unnecessary and would
        # otherwise need v1 Endpoints RBAC (deprecated in k8s 1.33+).
        - name: ENABLE_LEADER_ELECTION
          value: "false"
        ports:
        - name: nfs
          containerPort: 2049
        - name: mountd
          containerPort: 20048
        - name: rpcbind
          containerPort: 111
        - name: healthz
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 240
        readinessProbe:
          # Probe the NFS port directly rather than the watchdog's /ready: with
          # thousands of provisioned volumes the watchdog stays in "starting"
          # (HTTP 503) long after nfsd is actually serving, so /ready gave a
          # permanent false-negative and the pod never joined the Service.
          # A listening 2049 is the true "NFS is serving" signal.
          tcpSocket:
            port: 2049
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          # Watch nfsd directly (not the watchdog's /healthz, which stays 200
          # even when the kernel nfsd has died). If nfsd stops serving on 2049
          # for a sustained period, restart the pod so run_nfs.sh brings nfsd
          # back. Tolerant threshold (6 x 30s = 3min) so a transient blip does
          # not trigger an expensive remount of all volumes. The in-pod self-heal
          # in run_nfs.sh handles the common case faster, in place; this is the
          # backstop if that fails.
          tcpSocket:
            port: 2049
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          # nfs-server does real CPU work mounting/serving thousands of volumes
          # (the mount-all pass spikes to ~0.5 CPU). Without a request it ran as
          # BestEffort and was the first thing starved under node pressure,
          # which made even its own watchdog probe time out.
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        securityContext:
          privileged: true
        volumeMounts:
        - name: storage
          mountPath: /exports
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: nfs-exports
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  labels:
    app: nfs-server
spec:
  ports:
  - name: nfs
    port: 2049
  - name: mountd
    port: 20048
  - name: rpcbind
    port: 111
  selector:
    app: nfs-server
