apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-exports
  labels:
    app: nfs-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.apps.nfsserver.server.diskSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  labels:
    app: nfs-server
    usesvolume: nfs-exports
spec:
  # Recreate strategy: with an RWO PVC, a surge pod can never attach while the
  # old pod holds nfs-exports, so RollingUpdate would deadlock. Single-replica
  # by design.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-server
  template:

    metadata:
      labels:
        app: nfs-server
        usesvolume: nfs-exports
    spec:
      serviceAccountName: {{ template "nfs-subdir-external-provisioner.serviceAccountName" . }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: usesvolume
                    operator: In
                    values:
                      - nfs-exports
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: nfs-server
        image: {{ .Values.apps.nfsserver.harness.deployment.image }}
        imagePullPolicy: IfNotPresent
        env:
        # NFS useDNS {{ .Values.apps.nfsserver.nfs.useDNS }}
        {{- if .Values.apps.nfsserver.nfs.useDNS }}
        - name: NFS_SERVER
          value: {{ printf "nfs-server.%s.svc.cluster.local" .Values.namespace }}
        {{- end }}
        - name: NFS_PATH
          value: {{ .Values.apps.nfsserver.nfs.path }}
        - name: PROVISIONER_NAME
          value: {{ printf "%s-nfs-provisioner" .Values.namespace }}
        # Single-replica Deployment backed by an RWO PVC — only one pod can
        # ever mount /exports, so leader election is unnecessary and would
        # otherwise need v1 Endpoints RBAC (deprecated in k8s 1.33+).
        - name: ENABLE_LEADER_ELECTION
          value: "false"
        ports:
        - name: nfs
          containerPort: 2049
        - name: mountd
          containerPort: 20048
        - name: rpcbind
          containerPort: 111
        - name: healthz
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 240
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 30
          failureThreshold: 5
        securityContext:
          privileged: true
        volumeMounts:
        - name: storage
          mountPath: /exports
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: nfs-exports
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  labels:
    app: nfs-server
spec:
  ports:
  - name: nfs
    port: 2049
  - name: mountd
    port: 20048
  - name: rpcbind
    port: 111
  selector:
    app: nfs-server
