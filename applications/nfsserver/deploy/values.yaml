harness:
  subdomain: nfsserver
  service:
    auto: false
  deployment:
    auto: false
    # image: gcr.io/metacellllc/cloudharness/nfsserver:1.0


# nfs server pvc disk size (/exports)
server:
  diskSize: 10Gi

# nfs-subdir-external-provisioner
# https://github.com/MetaCell/nfs-subdir-external-provisioner
#fullnameOverride: nfs-provisioner
nameOverride: nfs-provisioner

replicaCount: 1
strategyType: Recreate

# provisionerImage:
#   repository: gcr.io/metacellllc/nfs-subdir-external-provisioner
#   tag: "1.0"
#   pullPolicy: IfNotPresent
# imagePullSecrets: []

# buildMode: true

nfs:
  server:  # auto set via nfs service ip address
  useDNS: true
  path: /exports     # /exports
  mountOptions:
  # `soft` overrides the Linux client default (`hard`). Without it, applications
  # block in uninterruptible sleep when the NFS server is unreachable. With
  # `soft`, I/O returns EIO after a few retries — applications stay alive and
  # can retry. This matches the availability-over-integrity tradeoff.
  - soft
  - nolock
  - local_lock=all
  - timeo=50         # 5 s per retry
  - retrans=2        # 2 retries → ~15 s before EIO during server downtime
  volumeName: nfs-subdir-external-provisioner-root
  # Reclaim policy for the main nfs volume
  reclaimPolicy: Retain

# For creating the StorageClass automatically:
storageClass:
  create: true

  # Set a provisioner name. If unset, a name will be generated.
  # provisionerName:

  # Set StorageClass as the default StorageClass
  # Ignored if storageClass.create is false
  defaultClass: false

  # Set a StorageClass base name (will be concatenated with namespace)
  # Ignored if storageClass.create is false
  name: nfs-client

  # Allow volume to be expanded dynamically
  allowVolumeExpansion: true

  # Method used to reclaim an obsoleted volume
  reclaimPolicy: Delete

  # When set to false your PVs will not be archived by the provisioner upon deletion of the PVC.
  archiveOnDelete: true

  # If it exists and has 'delete' value, delete the directory. If it exists and has 'retain' value, save the directory.
  # Overrides archiveOnDelete.
  # Ignored if value not set.
  onDelete:

  # Specifies a template for creating a directory path via PVC metadata's such as labels, annotations, name or namespace.
  # Ignored if value not set.
  pathPattern:

  # Set access mode - ReadWriteOnce, ReadOnlyMany or ReadWriteMany
  accessModes: ReadWriteOnce

  # Set volume bindinng mode - Immediate or WaitForFirstConsumer
  volumeBindingMode: Immediate

  # Storage class annotations
  annotations: {}

leaderElection:
  # When set to false leader election will be disabled
  enabled: true

# PodDisruptionBudget guardrail against accidental evictions.
# Off by default — enabling it blocks `kubectl drain` of the NFS server's
# node until the operator terminates the pod manually (RWO PVC means there
# is no surge pod that could satisfy minAvailable=1 while the old one runs).
# Does NOT help with ungraceful node loss (force-detach path).
podDisruptionBudget:
  enabled: false

## For RBAC support:
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# If true, create & use Pod Security Policy resources
# https://kubernetes.io/docs/concepts/policy/pod-security-policy/
podSecurityPolicy:
  enabled: false

# Deployment pod annotations
podAnnotations: {}

## Set pod priorityClassName
# priorityClassName: ""

podSecurityContext: {}

securityContext: {}

serviceAccount:
  # Specifies whether a ServiceAccount should be created
  create: true

  # Annotations to add to the service account
  annotations: {}

  # The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

resources:
  limits:
   cpu: 100m
   memory: 128Mi
  requests:
   cpu: 10m
   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {
  podAffinity: {
    requiredDuringSchedulingIgnoredDuringExecution: [{
      labelSelector: {
        matchExpressions: [{
          key: 'app',
          operator: 'In',
          values: ['nfs-server',]
        }]
      },
      topologyKey: kubernetes.io/hostname
    },]}
}

# Additional labels for any resource created
labels: {}
