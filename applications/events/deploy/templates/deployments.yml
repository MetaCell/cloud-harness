apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  serviceName: broker
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: broker
        image: {{ .Values.apps.events.kafka.image | quote }}
        imagePullPolicy: {{ .Values.apps.events.kafka.imagePullPolicy }}
        env:
        - name: CLUSTER_ID
          value: {{ .Values.apps.events.kafka.clusterId | quote }}
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: controller,broker
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:{{ .Values.apps.events.kafka.port }},CONTROLLER://:{{ .Values.apps.events.kafka.controllerPort }}
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka-0.broker.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.apps.events.kafka.port }}
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka-0.broker.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.apps.events.kafka.controllerPort }}
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        {{- range $key, $value := .Values.apps.events.kafka.config }}
        - name: KAFKA_{{ $key | upper | replace "." "_" | replace "-" "_" }}
          value: {{ $value | quote }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.apps.events.kafka.port }}
          name: client
        - containerPort: {{ .Values.apps.events.kafka.controllerPort }}
          name: controller
        startupProbe:
          tcpSocket:
            port: client
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: client
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: client
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - /opt/kafka/bin/kafka-server-stop.sh
        resources:
          {{- .Values.apps.events.kafka.resources | toYaml | nindent 10 }}
        volumeMounts:
        - mountPath: /var/lib/kafka/data
          name: data
      terminationGracePeriodSeconds: 30
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.apps.events.kafka.storage }}
      storageClassName: {{ .Values.apps.events.kafka.storageClassName }}
