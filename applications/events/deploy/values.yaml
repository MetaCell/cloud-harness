harness:
  subdomain: events
  secured: true
  service:
    auto: false
    name: events-ui
  deployment:
    auto: false
  test:
    e2e:
      enabled: true
kafka:
  name: bootstrap
  port: 9092
  controllerPort: 9093
  image: docker.io/apache/kafka:4.0.2
  imagePullPolicy: IfNotPresent
  clusterId: 5L6g3nShT-eMCtK--X86sw
  logDirs: /var/lib/kafka/data/kraft-combined-logs
  storage: 10Gi
  storageClassName: standard
  podSecurityContext:
    fsGroup: 1000
  config:
    auto.create.topics.enable: "true"
    num.partitions: "3"
    default.replication.factor: "1"
    min.insync.replicas: "1"
    offsets.topic.replication.factor: "1"
    transaction.state.log.replication.factor: "1"
    transaction.state.log.min.isr: "1"
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 100Mi
