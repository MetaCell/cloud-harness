# Base of the GitHub Actions workflows generated by `harness-deployment -ci github`.
# github-template-<env>.yaml adds the workflow name, the triggers and the per-environment deltas; a project
# overrides any part from its own deployment-configuration/github-template[-<env>].yaml (dicts merge key by
# key, lists are replaced, `null` removes a job).
# `tests-api` and `tests-e2e` are prototypes, expanded into one job per app ($CH_NAME, $CH_IMAGE and $CH_TAG
# stand for the app's image). A `$...` item in a steps list is a fragment the generator fills in.
# Every job without `runs-on` runs on the runner named by the CH_GITHUB_RUNNER repository/organization variable
# (prepare, when it builds the images: CH_GITHUB_BUILD_RUNNER first), falling back to the runner given at
# generation time (CH_GITHUB_RUNNER environment variable, default ubuntu-latest).
permissions:
  contents: read
  packages: write
# Generator-only settings, never part of the workflow.
cloudharness:
  # The skaffold the build and deploy steps use (a YAML anchor, repeated where it is aliased).
  install_skaffold: &install-skaffold
    name: Install skaffold
    env:
      SKAFFOLD_VERSION: v2.25.0
      SKAFFOLD_SHA256: 42b9e2e3246c19b78fcc53dd60cc7ded1da8704293886b909a2a02b9bef34d20
    run: |
      mkdir -p "$RUNNER_TEMP/bin"
      curl -fsSLo "$RUNNER_TEMP/bin/skaffold" "https://github.com/GoogleContainerTools/skaffold/releases/download/$SKAFFOLD_VERSION/skaffold-linux-amd64"
      echo "$SKAFFOLD_SHA256  $RUNNER_TEMP/bin/skaffold" | sha256sum -c -
      chmod +x "$RUNNER_TEMP/bin/skaffold"
      echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
  # Steps building and pushing the images whose tag is not in the registry yet, then running the unit tests,
  # inserted where prepare says `- $BUILD_STEPS`. prepare's harness-deployment lists just those images in
  # deployment/skaffold-ci.yaml, each one a `docker buildx build --push` with its registry cache
  # (<image>:buildcache, mode=max): skaffold runs them in parallel, a base image before the images built on it.
  # A bigger build runner (CH_GITHUB_BUILD_RUNNER) means more parallel builds. The same file's `test` section
  # holds every app's unit tests, run by `skaffold test` against every image of the deployment
  # (deployment/skaffold-images.json), rebuilt or not. null builds and tests nothing (stage and prod deploy
  # published images).
  build:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ steps.env.outputs.registry_host }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - *install-skaffold
    - name: Build and push the images
      env:
        NOCACHE: ${{ github.run_id }}
        CH_BRANCH_TAG: ${{ steps.env.outputs.branch_tag }}
      run: skaffold build --filename deployment/skaffold-ci.yaml --cache-artifacts=false --update-check=false --interactive=false
    - name: Run the unit tests
      run: skaffold test --filename deployment/skaffold-ci.yaml --build-artifacts deployment/skaffold-images.json --update-check=false --interactive=false
  # Steps giving kubectl and helm access to the cluster, inserted where a job says `- $KUBE_AUTH`.
  # Default: a kubeconfig from the KUBECONFIG secret (base64) when it is set, otherwise the ambient
  # configuration (the service account of a runner that lives in the target cluster). Replace the list
  # for another method, e.g. google-github-actions/auth + get-gke-credentials with workload identity
  # (which also needs `permissions: {contents: read, packages: write, id-token: write}` on the jobs
  # using it: id-token is deliberately not granted to the whole workflow).
  kube_auth:
    - uses: azure/setup-kubectl@v4
    - name: Configure kubectl
      env:
        KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
      run: |
        if [ -n "$KUBECONFIG_DATA" ]; then
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        elif [ -n "$KUBERNETES_SERVICE_HOST" ] || kubectl config current-context > /dev/null 2>&1; then
          echo "Using the runner's ambient cluster access"
        else
          echo "::error::No cluster access: set the KUBECONFIG secret (base64 kubeconfig) where this job can read it, or run on a runner inside the target cluster"
          exit 1
        fi
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CLOUDHARNESS_BRANCH: ${{ vars.CLOUDHARNESS_BRANCH || 'develop' }}
jobs:
  # prepare also builds the images and runs the unit tests ($BUILD_STEPS): a re-run asks the registry again, so
  # after a failure it only builds what the failed attempt did not push, and tests everything again.
  prepare:
    name: Prepare and build
    env:
      NAMESPACE: ${{ vars.NAMESPACE }}
      DOMAIN: ${{ vars.DOMAIN }}
      REGISTRY: ${{ vars.REGISTRY }}
      REGISTRY_SECRET: ${{ vars.REGISTRY_SECRET }}
      IMAGE_CACHE_URL: ${{ vars.IMAGE_CACHE_URL }}
      CHART_NAME: ${{ vars.CHART_NAME }}
      CHART_VERSION: ${{ vars.CHART_VERSION }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      PUBLISH_TAG: ${{ inputs.publish_tag || vars.DEPLOYMENT_PUBLISH_TAG }}
      DEPLOYMENT_TAG: ${{ inputs.deployment_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      SKIP_TESTS: ${{ inputs.skip_tests || vars.SKIP_TESTS }}
      FORCE_BUILD: ${{ inputs.force_build }}
    outputs:
      branch_tag: ${{ steps.env.outputs.branch_tag }}
      short_sha: ${{ steps.env.outputs.short_sha }}
      registry_host: ${{ steps.env.outputs.registry_host }}
      namespace: ${{ steps.env.outputs.namespace }}
      publish_tag: ${{ steps.env.outputs.publish_tag }}
      deployment_tag: ${{ steps.env.outputs.deployment_tag }}
      skip_tests: ${{ steps.env.outputs.skip_tests }}
      force_build: ${{ steps.env.outputs.force_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - $GIT_CLONES
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
      - name: Install cloud-harness tools
        run: bash cloud-harness/install.sh
      - name: Resolve pipeline variables
        id: env
        run: |
          branch_tag=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-128)
          {
            echo "branch_tag=$branch_tag"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "registry_host=${REGISTRY%%/*}"
            echo "namespace=$NAMESPACE"
            echo "publish_tag=$PUBLISH_TAG"
            echo "deployment_tag=$DEPLOYMENT_TAG"
            echo "skip_tests=$SKIP_TESTS"
            echo "force_build=$FORCE_BUILD"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare helm chart
        id: images
        run: |
          HELM_META_ARGS=""
          if [ -n "$CHART_NAME" ]; then HELM_META_ARGS="$HELM_META_ARGS --name $CHART_NAME"; fi
          if [ -n "$CHART_VERSION" ]; then HELM_META_ARGS="$HELM_META_ARGS --chart-version $CHART_VERSION"; fi
          APP_VERSION_RESOLVED="${APP_VERSION:-$DEPLOYMENT_TAG}"
          if [ -n "$APP_VERSION_RESOLVED" ]; then HELM_META_ARGS="$HELM_META_ARGS --app-version $APP_VERSION_RESOLVED"; fi
          TAG_ARG=""
          if [ -n "$DEPLOYMENT_TAG" ]; then TAG_ARG="-t $DEPLOYMENT_TAG"; fi
          harness-deployment $PATHS -d "$DOMAIN" -r "$REGISTRY" -rsn "$REGISTRY_SECRET" -n "$NAMESPACE" -e $ENV $TAG_ARG --write-env --write-skaffold-ci --cache-url "$IMAGE_CACHE_URL" --force-build "$FORCE_BUILD" -N $HELM_META_ARGS $PARAMS
          cat deployment/.env >> "$GITHUB_OUTPUT"
      - name: View helm chart
        run: helm template ./deployment/helm --debug -n "$NAMESPACE"
      - name: Share the deployment with the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: cloudharness-deployment
          path: deployment
          include-hidden-files: true
          if-no-files-found: error
          # a re-run of prepare (e.g. after a failed build) uploads it again
          overwrite: true
      - $BUILD_STEPS
  # deploy targets the GitHub environment named after the CloudHarness environment: its protection
  # rules (required reviewers on stage/prod) approve the deployment. Every job naming an environment is
  # gated by those rules, so the test cleanup does not: it reads the cluster credentials from
  # repository/organization secrets (an environment secret of the same name overrides them for deploy).
  # skaffold deploy installs or upgrades the helm chart prepare wrote (deployment/skaffold-ci.yaml) and waits
  # until its deployments and statefulsets are rolled out. It labels every pod template with its run id: a
  # constant one keeps the apps whose image did not change from restarting.
  deploy:
    name: Deploy
    needs: [prepare]
    environment: $ENV
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: deployment
      - uses: azure/setup-helm@v4
      - $KUBE_AUTH
      - $HELM_SECRETS_STEPS
      - *install-skaffold
      - name: Deploy and wait for the rollout
        run: skaffold deploy --filename deployment/skaffold-ci.yaml --build-artifacts deployment/skaffold-images.json --label skaffold.dev/run-id=cloudharness --update-check=false --interactive=false
  tests-api:
    name: API tests
    needs: [prepare, deploy]
    if: ${{ needs.prepare.outputs.skip_tests != 'true' }}
    steps:
      - name: Give the certificates time to settle
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: deployment
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - $TEST_STEPS
  tests-e2e:
    name: End to end tests
    needs: [prepare, deploy]
    if: ${{ needs.prepare.outputs.skip_tests != 'true' }}
    commands:
      - npx puppeteer browsers install chrome
      - yarn test
    steps:
      - name: Give the certificates time to settle
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - $TEST_STEPS
  # Runs once the tests are done, and only if nothing failed. To publish despite failing API/E2E tests
  # (Codefresh's fail_fast: false), override the `if` in the project template and protect the `publish`
  # environment with required reviewers.
  publish:
    name: Publish images
    needs: [prepare, deploy, tests-api, tests-e2e]
    if: ${{ !cancelled() && needs.prepare.outputs.publish_tag != '' && needs.deploy.result == 'success' && !contains(needs.*.result, 'failure') }}
    environment: publish
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Log in to the publish registry
        if: ${{ vars.REGISTRY_PUBLISH_URL != '' }}
        env:
          REGISTRY_PUBLISH_URL: ${{ vars.REGISTRY_PUBLISH_URL }}
          USERNAME: ${{ secrets.REGISTRY_PUBLISH_USERNAME || secrets.REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.REGISTRY_PUBLISH_PASSWORD || secrets.REGISTRY_PASSWORD }}
        run: echo "$PASSWORD" | docker login "${REGISTRY_PUBLISH_URL%%/*}" -u "$USERNAME" --password-stdin
      - $PUBLISH_STEPS
