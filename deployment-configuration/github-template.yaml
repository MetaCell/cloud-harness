# Base of the GitHub Actions workflows generated by `harness-deployment -ci github`.
# github-template-<env>.yaml adds the workflow name, the triggers and the per-environment deltas; a project
# overrides any part from its own deployment-configuration/github-template[-<env>].yaml (dicts merge key by
# key, lists are replaced, `null` removes a job).
# `build`, `build-test-images`, `tests-unit`, `tests-api` and `tests-e2e` are prototypes, expanded into one
# job per image/app ($CH_NAME, $CH_IMAGE and $CH_TAG stand for the image being expanded). A `$...` item in a steps
# list is a fragment the generator fills in. Every job without `runs-on` gets the runner given at generation
# time (CH_GITHUB_RUNNER, default ubuntu-latest).
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CLOUDHARNESS_BRANCH: ${{ vars.CLOUDHARNESS_BRANCH || 'develop' }}
jobs:
  prepare:
    name: Prepare helm chart
    env:
      NAMESPACE: ${{ vars.NAMESPACE }}
      DOMAIN: ${{ vars.DOMAIN }}
      REGISTRY: ${{ vars.REGISTRY }}
      REGISTRY_SECRET: ${{ vars.REGISTRY_SECRET }}
      IMAGE_CACHE_URL: ${{ vars.IMAGE_CACHE_URL }}
      CHART_NAME: ${{ vars.CHART_NAME }}
      CHART_VERSION: ${{ vars.CHART_VERSION }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      PUBLISH_TAG: ${{ inputs.publish_tag || vars.DEPLOYMENT_PUBLISH_TAG }}
      DEPLOYMENT_TAG: ${{ inputs.deployment_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      SKIP_TESTS: ${{ inputs.skip_tests || vars.SKIP_TESTS }}
      FORCE_BUILD: ${{ inputs.force_build }}
    outputs:
      branch_tag: ${{ steps.env.outputs.branch_tag }}
      short_sha: ${{ steps.env.outputs.short_sha }}
      registry_host: ${{ steps.env.outputs.registry_host }}
      namespace: ${{ steps.env.outputs.namespace }}
      publish_tag: ${{ steps.env.outputs.publish_tag }}
      deployment_tag: ${{ steps.env.outputs.deployment_tag }}
      skip_tests: ${{ steps.env.outputs.skip_tests }}
      force_build: ${{ steps.env.outputs.force_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - $GIT_CLONES
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
      - name: Install cloud-harness tools
        run: bash cloud-harness/install.sh
      - name: Resolve pipeline variables
        id: env
        run: |
          branch_tag=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-128)
          {
            echo "branch_tag=$branch_tag"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "registry_host=${REGISTRY%%/*}"
            echo "namespace=$NAMESPACE"
            echo "publish_tag=$PUBLISH_TAG"
            echo "deployment_tag=$DEPLOYMENT_TAG"
            echo "skip_tests=$SKIP_TESTS"
            echo "force_build=$FORCE_BUILD"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare helm chart
        id: images
        run: |
          HELM_META_ARGS=""
          if [ -n "$CHART_NAME" ]; then HELM_META_ARGS="$HELM_META_ARGS --name $CHART_NAME"; fi
          if [ -n "$CHART_VERSION" ]; then HELM_META_ARGS="$HELM_META_ARGS --chart-version $CHART_VERSION"; fi
          APP_VERSION_RESOLVED="${APP_VERSION:-$DEPLOYMENT_TAG}"
          if [ -n "$APP_VERSION_RESOLVED" ]; then HELM_META_ARGS="$HELM_META_ARGS --app-version $APP_VERSION_RESOLVED"; fi
          TAG_ARG=""
          if [ -n "$DEPLOYMENT_TAG" ]; then TAG_ARG="-t $DEPLOYMENT_TAG"; fi
          harness-deployment $PATHS -d "$DOMAIN" -r "$REGISTRY" -rsn "$REGISTRY_SECRET" -n "$NAMESPACE" -e $ENV $TAG_ARG --write-env --cache-url "$IMAGE_CACHE_URL" --force-build "$FORCE_BUILD" -N $HELM_META_ARGS $PARAMS
          cat deployment/.env >> "$GITHUB_OUTPUT"
      - name: View helm chart
        run: helm template ./deployment/helm --debug -n "$NAMESPACE"
      - name: Share the deployment with the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: cloudharness-deployment
          path: |
            deployment
            .overrides
          include-hidden-files: true
          if-no-files-found: error
  build:
    name: Build
    needs: [prepare]
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - $GIT_CLONES
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Check whether $CH_NAME already exists in the registry
        id: check
        env:
          IMAGE: $CH_IMAGE:$CH_TAG
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push $CH_NAME
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=registry,ref=$CH_IMAGE:buildcache
          cache-to: type=registry,ref=$CH_IMAGE:buildcache,mode=max
  build-test-images:
    name: Build test image
  tests-unit:
    name: Unit tests
    needs: [prepare, build]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - $TEST_STEPS
  deploy:
    name: Deploy
    needs: [prepare, build, tests-unit]
    env:
      HELM_FLAGS: --timeout 200s --create-namespace
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: .
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - $HELM_SECRETS_STEPS
      - name: Install chart
        env:
          NAMESPACE: ${{ needs.prepare.outputs.namespace }}
        run: helm upgrade --install "$NAMESPACE" deployment/helm -n "$NAMESPACE" $HELM_FLAGS -f deployment/helm/values.yaml $HELM_SET_ARGS
  wait-deployment:
    name: Wait for the deployment
    needs: [prepare, deploy]
    if: ${{ needs.prepare.outputs.skip_tests != 'true' }}
    timeout-minutes: 15
    env:
      NAMESPACE: ${{ needs.prepare.outputs.namespace }}
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config set-context --current --namespace="$NAMESPACE"
      - $ROLLOUT_STEPS
  tests-api:
    name: API tests
    needs: [prepare, wait-deployment, build-test-images]
    if: ${{ needs.prepare.outputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: .
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - $TEST_STEPS
  tests-e2e:
    name: End to end tests
    needs: [prepare, wait-deployment, build-test-images]
    if: ${{ needs.prepare.outputs.skip_tests != 'true' }}
    commands:
      - npx puppeteer browsers install chrome
      - yarn test
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - $TEST_STEPS
  publish:
    name: Publish images
    needs: [prepare, deploy, tests-unit, tests-api, tests-e2e]
    if: ${{ needs.prepare.outputs.publish_tag != '' }}
    environment: publish
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Log in to the publish registry
        if: ${{ vars.REGISTRY_PUBLISH_URL != '' }}
        env:
          REGISTRY_PUBLISH_URL: ${{ vars.REGISTRY_PUBLISH_URL }}
          USERNAME: ${{ secrets.REGISTRY_PUBLISH_USERNAME || secrets.REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.REGISTRY_PUBLISH_PASSWORD || secrets.REGISTRY_PASSWORD }}
        run: echo "$PASSWORD" | docker login "${REGISTRY_PUBLISH_URL%%/*}" -u "$USERNAME" --password-stdin
      - $PUBLISH_STEPS
