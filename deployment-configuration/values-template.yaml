debug: false

source_images:
  # -- Gatekeeper image, pulled by the gatekeeper deployment generated for every secured
  # application. Set here rather than per application so that it is configured in one place.
  GATEKEEPER: quay.io/gogatekeeper/gatekeeper:4.6.0

# CloudHarness integration defaults for the unmodified ArgoProj Helm chart.
argo-workflows:
  singleNamespace: true
  workflow:
    serviceAccount:
      name: argo-workflows
  controller:
    envFrom:
      - configMapRef:
          name: argo-cloudharness-env
  server:
    authModes: [server]
    envFrom:
      - configMapRef:
          name: argo-cloudharness-env
