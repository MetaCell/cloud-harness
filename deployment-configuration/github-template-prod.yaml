# Production pipeline: deploys the images promoted with the given tag, nothing else.
# Protect the `prod` environment with required reviewers to get an approval step.
name: CloudHarness $ENV
on:
  workflow_dispatch:
    inputs:
      deployment_tag:
        description: Tag of the images to deploy (a tag given by the promote workflow)
        type: string
        required: true
# deploys the promoted images: builds nothing
cloudharness:
  build: null
jobs:
  prepare:
    name: Prepare helm chart
  tests-api: null
  tests-e2e: null
