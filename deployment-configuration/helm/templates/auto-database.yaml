{{- if .Values.backup.active }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: "db-backups"
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backup.volumesize }}
---
{{- end }}
{{- define "deploy_utils.database" }}
{{- if and (eq .app.harness.database.type "postgres") (dig "postgres" "operator" false .app.harness.database) }}
{{- include "deploy_utils.database.postgres.operator" . }}
{{- else }}
{{- $isStatefulSet := .app.harness.database.statefulset | default false }}
{{- /* A statefulset database owns its volume through volumeClaimTemplates. A PVC named after the
      database is the leftover of a previous Deployment: it is kept (never deleted by helm) and
      its data is copied into the statefulset volume by a migration job (see
      auto-volume-migration.yaml). Delete the legacy PVC once migrated. */}}
{{- $legacyClaim := false }}
{{- if $isStatefulSet }}
{{- if lookup "v1" "PersistentVolumeClaim" .root.Values.namespace .app.harness.database.name }}
{{- $legacyClaim = true }}
{{- end }}
{{- end }}
{{- if or (not $isStatefulSet) $legacyClaim }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .app.harness.database.name | quote }}
  namespace: {{ .root.Values.namespace }}
  {{- if $legacyClaim }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- $storageClass := include "deploy_utils.databaseStorageClass" .app.harness.database }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .app.harness.database.size }}
{{- end }}
---
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $isStatefulSet }}
metadata:
  name: {{ .app.harness.database.name | quote }}
  namespace: {{ .root.Values.namespace }}
  labels:
    usesvolume: {{ .app.harness.database.name }}-{{ .root.Values.namespace }}
spec:
  {{- if $isStatefulSet }}
  # StatefulSet updates terminate the old pod before creating its replacement, so no
  # Recreate strategy or node pinning is needed.
  serviceName: {{ .app.harness.database.name | quote }}
  # With the default OrderedReady policy the controller waits for every existing pod
  # to be Running and Ready before applying a template update, so a crash-looping pod
  # blocks the rollout of its own fix. Parallel lifts that gate; ordered bring-up is
  # not needed for a single-replica database. Immutable field: changing it on an
  # existing deployment requires deleting the StatefulSet (use --cascade=orphan).
  podManagementPolicy: Parallel
  {{- else }}
  # The database's ReadWriteOnce volume attaches to a single node and the pod is
  # pinned to it via podAffinity. Recreate terminates the old pod before starting
  # the new one, avoiding an unschedulable pod when the node can't fit both.
  strategy:
    type: Recreate
  {{- end }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .app.harness.database.name | quote }}
  template:
    metadata:
      labels:
        app: {{ .app.harness.database.name | quote }}
        service: db
        usesvolume: {{ .app.harness.database.name }}-{{ .root.Values.namespace }}
    spec:
      {{- if not $isStatefulSet }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: usesvolume
                    operator: In
                    values:
                      - {{ .app.harness.database.name }}-{{ .root.Values.namespace }}
                      - {{ .app.harness.database.name }} # Obsolete, kept for backwards compatability, to be removed at a later date
              topologyKey: "kubernetes.io/hostname"
      {{- end }}
      {{- if $legacyClaim }}
      initContainers:
      # Holds the pod until the volume-migration job has copied the legacy volume data into
      # the statefulset volume. Delete the legacy PVC after verifying the migration.
      - name: volume-migration
        image: busybox:1.36
        command: ['sh', '-c', 'until [ -f /migration/target/.cloudharness-volume-migrated ]; do echo "waiting for the volume migration job"; sleep 5; done']
        volumeMounts:
          - name: {{ .app.harness.database.name | quote }}
            mountPath: /migration/target
      {{- end }}
      containers:
      - name: {{ .app.harness.database.name | quote }}
        imagePullPolicy: IfNotPresent
        {{ include (print "deploy_utils.database." .app.harness.database.type) (dict "root" .root "app" .app) }}
        ports:
        {{- range $port := (index .app.harness.database .app.harness.database.type).ports }}
        - name: {{ $port.name }}
          containerPort: {{ $port.port }}
        {{- end }}
        {{- include "deploy_utils.resources" .app.harness.database.resources | nindent 8 }}
        volumeMounts:
          - name: {{ .app.harness.database.name | quote }}
            mountPath: /data/db
          {{- if eq .app.harness.database.type "postgres" }}
          - mountPath: /dev/shm
            name: dshm  
          {{- end }}  
      {{- if or (not $isStatefulSet) (eq .app.harness.database.type "postgres") }}
      volumes:
      {{- if not $isStatefulSet }}
      - name: {{ .app.harness.database.name | quote }}
        persistentVolumeClaim:
          claimName: {{ .app.harness.database.name | quote }}
      {{- end }}
      {{- if eq .app.harness.database.type "postgres" }}
      - emptyDir:
          medium: Memory
        name: dshm
      {{- end }}
      {{- end }}
  {{- if $isStatefulSet }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .app.harness.database.name | quote }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- $storageClass := include "deploy_utils.databaseStorageClass" .app.harness.database }}
        {{- if $storageClass }}
        storageClassName: {{ $storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .app.harness.database.size }}
  {{- end }}
  {{- if $legacyClaim }}
  {{- include "deploy_utils.volumeMigration" (dict "root" .root "name" .app.harness.database.name "pvc" .app.harness.database.name) }}
  {{- end }}
---
{{- if and .root.Values.backup.active (ne .app.harness.database.type "neo4j") }}
{{- include (print "deploy_utils.database." .app.harness.database.type ".backup") . }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .app.harness.database.name | quote }}
  namespace: {{ .root.Values.namespace }}
  labels:
    app: {{ .app.harness.deployment.name | quote }}
{{ include "deploy_utils.labels" .root | indent 4 }}
spec:
  type: {{ if .app.harness.database.expose }}LoadBalancer{{ else }}ClusterIP{{ end }}
  selector:
    app: {{ .app.harness.database.name | quote }}
  ports:
  {{- range $port := (index .app.harness.database .app.harness.database.type).ports }}
  - name: {{ $port.name }}
    port: {{ $port.port }}
  {{- end }}
{{- end }}
---
{{- include "deploy_utils.database_network_policy" (dict "root" .root "app" .app) }}
{{ end }}
{{- range $app := .Values.apps }}
  {{- if  $app.harness.database  }}
    {{- if $app.harness.database.auto  }}
      {{ include "deploy_utils.database" (dict "root" $ "app" $app) }}
    {{- end }}
    {{- range $subapp := $app }}
    {{- if contains "map" (typeOf $subapp)  }}
    {{- if hasKey $subapp "harness"}}
    {{- if and (hasKey $subapp.harness "database") $subapp.harness.database.auto }}
        {{ include "deploy_utils.database" (dict "root" $ "app" $subapp) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
 {{- end }}
