{{- if and .Values.registry.name .Values.registry.secret .Values.registry.secret.name }}
{{- $secretValue := .Values.registry.secret.value }}
{{- $secretName := .Values.registry.secret.name }}
{{- /* If value is empty/null, check if the secret already exists in the cluster and skip creation */ -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if or $secretValue (not $existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
{{- if $secretValue }}
{{- $isBase64 := false }}
{{- /* Detect if the value is already base64-encoded (not starting with { means it's not raw JSON) */ -}}
{{- if not (hasPrefix "{" ($secretValue | trim)) }}
  {{- $isBase64 = true }}
{{- end }}
{{- if $isBase64 }}
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"_json_key","password":%s,"auth":"%s"}}}` .Values.registry.name ($secretValue | b64dec | toJson) (printf "_json_key:%s" ($secretValue | b64dec) | b64enc) | b64enc }}
{{- else }}
stringData:
  .dockerconfigjson: |-
    {
      "auths": {
        "{{ .Values.registry.name }}": {
          "username": "_json_key",
          "password": {{ $secretValue | toJson }},
          "auth": "{{ printf "_json_key:%s" $secretValue | b64enc }}"
        }
      }
    }
{{- end }}
{{- else }}
stringData:
  .dockerconfigjson: "{}"
{{- end }}
{{- end }}
{{- end }}