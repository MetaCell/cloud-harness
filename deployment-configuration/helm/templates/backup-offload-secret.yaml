{{- /* Resolve a value that may be plain text or base64-encoded.
       Round-trip check: decode, re-encode — if it matches the original the input was base64. */ -}}
{{- define "deploy_utils.resolveCredValue" -}}
{{- $raw := . -}}
{{- $decoded := ($raw | b64dec) -}}
{{- if and (ne $decoded "") (eq ($decoded | b64enc) $raw) -}}
{{- $decoded -}}
{{- else -}}
{{- $raw -}}
{{- end -}}
{{- end -}}
{{- $offload := .Values.backup.offload }}
{{- $s3AKValue := include "deploy_utils.resolveCredValue" $offload.s3.accessKeyId.value }}
{{- $s3SKValue := include "deploy_utils.resolveCredValue" $offload.s3.secretAccessKey.value }}
{{- $gcsValue := include "deploy_utils.resolveCredValue" $offload.gcs.applicationCredentials.value }}
{{- $hasS3Creds := and $offload.s3.region $s3AKValue $s3SKValue }}
{{- $hasGcsCreds := and $offload.gcs.applicationCredentials.name $gcsValue }}
{{- if and .Values.backup.active $offload.destinationPath (or $hasS3Creds $hasGcsCreds) }}
apiVersion: v1
kind: Secret
metadata:
  name: backup-offload-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  {{- if $hasS3Creds }}
  {{ $offload.s3.accessKeyId.name | default "AWS_ACCESS_KEY_ID" }}: {{ $s3AKValue | quote }}
  {{ $offload.s3.secretAccessKey.name | default "AWS_SECRET_ACCESS_KEY" }}: {{ $s3SKValue | quote }}
  {{- end }}
  {{- if $hasGcsCreds }}
  {{ $offload.gcs.applicationCredentials.name | default "APPLICATION_CREDENTIALS" }}: {{ $gcsValue | toJson }}
  {{- end }}
{{- end }}
