{{- define "deploy_utils.pvolume" }}
{{- $volume := .app.harness.deployment.volume }}
{{- $isStatefulSet := .app.harness.deployment.statefulset | default false }}
{{- /* ReadWriteMany volumes are shared by all the pods using them: they are never provisioned
      per replica through volumeClaimTemplates, hence never owned by a statefulset. */}}
{{- $writeMany := include "deploy_utils.volumeWriteMany" $volume }}
{{- $ownVolume := false }}
{{- if not $writeMany }}
{{- if or (not (hasKey $volume "auto")) $volume.auto }}
{{- $ownVolume = true }}
{{- end }}
{{- end }}
{{- /* Statefulsets own their (ReadWriteOnce) volume through volumeClaimTemplates: the standalone PVC
      is only kept while a legacy one exists, so that its data can be migrated. Delete the legacy
      PVC once migrated. */}}
{{- $legacyClaim := false }}
{{- if and $isStatefulSet $ownVolume }}
{{- if lookup "v1" "PersistentVolumeClaim" .root.Values.namespace $volume.name }}
{{- $legacyClaim = true }}
{{- end }}
{{- end }}
{{- if and (or (not (hasKey $volume "auto")) $volume.auto) (or (not (and $isStatefulSet $ownVolume)) $legacyClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $volume.name }}
  {{- if $legacyClaim }}
  annotations:
    # Legacy volume pending migration to the statefulset volumes: never deleted by helm.
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    app: {{ .app.harness.deployment.name| quote }}
spec:
  {{- include "deploy_utils.volumeClaimSpec" (dict "root" .root "volume" $volume) | nindent 2 }}
{{- end }}
---
{{- end }}
{{- range $app := .Values.apps }}
    {{- if and $app.harness.deployment.auto $app.harness.deployment.volume }}
---
    {{- include "deploy_utils.pvolume" (dict "root" $ "app" $app) }}
    {{- end }}
{{- end }}
