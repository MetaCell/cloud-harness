{{- define "deploy_utils.deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .app.harness.deployment.name| quote }}
  namespace: {{ .root.Values.namespace }}
  labels:
    app: {{ .app.harness.deployment.name| quote }}
    {{- if .app.harness.deployment.volume }}
    usesvolume: {{ .app.harness.deployment.volume.name }}-{{ .root.Values.namespace }}
    {{- end }}
{{- include "deploy_utils.labels" .root | indent 4 }}
spec:
  {{- if and .app.harness.deployment.volume (or (not (hasKey .app.harness.deployment.volume "usenfs")) (not .app.harness.deployment.volume.usenfs)) }}
  # A ReadWriteOnce volume attaches to a single node and the pod is pinned to the
  # volume's node via podAffinity (see below). Recreate terminates the old pod
  # before starting the new one, avoiding an unschedulable pod when the node can't
  # fit both. NFS (ReadWriteMany) volumes have no pinning and can roll normally.
  strategy:
    type: Recreate
  {{- end }}
  replicas: {{ .app.harness.deployment.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .app.harness.deployment.name| quote }}
{{- include "deploy_utils.labels" .root | indent 6 }}
  template:
    metadata:
      {{- if .app.harvest }}
      annotations:
        co.elastic.logs/enabled: "true"
        metricbeat: "true"
      {{- end }}
      labels:
        app: {{ .app.harness.deployment.name| quote }}
        {{- if .app.harness.deployment.volume }}
        usesvolume: {{ .app.harness.deployment.volume.name }}-{{ .root.Values.namespace }}
        {{- end }}
{{- include "deploy_utils.labels" .root | indent 8 }}
    spec:
      {{- if and .root.Values.registry.secret .root.Values.registry.secret.name (contains .root.Values.registry.name .app.harness.deployment.image) }}
      imagePullSecrets:
      - name: {{ .root.Values.registry.secret.name }}
      {{- end }}
      {{- if and .app.harness.deployment.volume }}
      {{- if or (not (hasKey .app.harness.deployment.volume "usenfs")) (not .app.harness.deployment.volume.usenfs) }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: usesvolume
                    operator: In
                    values:
                      - {{ .app.harness.deployment.volume.name }}-{{ .root.Values.namespace }}
                      - {{ .app.harness.deployment.volume.name }} # Obsolete, kept for backwards compatability, to be removed at a later date
              topologyKey: "kubernetes.io/hostname"
      {{- end }}
      {{- end }}
      {{- if .app.harness.deployment.extraContainers }}
      {{- $hasInit := false }}
      {{- range $name, $container := .app.harness.deployment.extraContainers }}
      {{- if and $container.auto $container.initContainer }}
      {{- $hasInit = true }}
      {{- end }}
      {{- end }}
      {{- if $hasInit }}
      initContainers:
      {{- range $name, $container := .app.harness.deployment.extraContainers }}
      {{- if and $container.auto $container.initContainer }}
      {{- include "deploy_utils.extraContainerSpec" (dict "name" $name "container" $container "app" $.app "root" $.root) | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .app.harness.deployment.name| default "cloudharness-docs" | quote }}
        image: {{ .app.harness.deployment.image }}
        imagePullPolicy: {{ include "deploy_utils.pullpolicy" .root }}
        {{- if .app.harness.deployment.command }}
        command: {{ .app.harness.deployment.command }}
        {{- end }}
        {{- if .app.harness.deployment.args }}
        args: {{ .app.harness.deployment.args }}
        {{- end }}
        env:
        - name: CH_CURRENT_APP_NAME
          value: {{ .app.harness.name | quote }}
          {{- include "deploy_utils.env" .root | nindent 8 }}
          {{- include "deploy_utils.privenv" .root | nindent 8 }}
          {{- if .app.harness.env }}
            {{- .app.harness.env | toYaml | nindent 8 }}
          {{- end }}
          {{- range $name, $value := .app.harness.envmap }}
        - name: {{ $name | quote }}
          value: {{ $value | quote }}
          {{- end }}
{{ if .app.harness.livenessProbe }}
        livenessProbe:
          httpGet:
            path: {{ .app.harness.livenessProbe.path }}
            port: {{ coalesce .app.harness.livenessProbe.port .app.harness.deployment.port 8080 }}
          periodSeconds: {{ .app.harness.livenessProbe.periodSeconds | default 10 }}
          failureThreshold: {{ .app.harness.livenessProbe.failureThreshold | default 3 }}
          initialDelaySeconds: {{ .app.harness.livenessProbe.initialDelaySeconds | default 0 }}
{{ end }}
{{ if .app.harness.readinessProbe }}
        readinessProbe:
          httpGet:
            path: {{ .app.harness.readinessProbe.path }}
            port: {{ coalesce .app.harness.readinessProbe.port .app.harness.deployment.port 8080 }}
          periodSeconds: {{ .app.harness.readinessProbe.periodSeconds | default 10 }}
          failureThreshold: {{ .app.harness.readinessProbe.failureThreshold | default 3 }}
          initialDelaySeconds: {{ .app.harness.readinessProbe.initialDelaySeconds | default 0 }}
{{ end }}
{{ if .app.harness.startupProbe }}
        startupProbe:
          httpGet:
            path: {{ .app.harness.startupProbe.path }}
            port: {{ coalesce .app.harness.startupProbe.port .app.harness.deployment.port 8080 }}
          periodSeconds: {{ .app.harness.startupProbe.periodSeconds | default 10 }}
          failureThreshold: {{ .app.harness.startupProbe.failureThreshold | default 30 }}
          initialDelaySeconds: {{ .app.harness.startupProbe.initialDelaySeconds | default 0 }}
{{ end }}
        ports:
          - containerPort: {{ .app.harness.deployment.port | default 8080 }}
        {{- include "deploy_utils.resources" .app.harness.deployment.resources | nindent 8 }}

        {{- include "deploy_utils.volumeMounts" (dict "app" .app "root" .root) | nindent 8 }}
      {{- if .app.harness.deployment.extraContainers }}
      {{- range $name, $container := .app.harness.deployment.extraContainers }}
      {{- if and $container.auto (not $container.initContainer) }}
      {{- include "deploy_utils.extraContainerSpec" (dict "name" $name "container" $container "app" $.app "root" $.root) | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- end }}
      volumes:
        - name: cloudharness-allvalues
          configMap:
            name: cloudharness-allvalues
        {{- $root := .root }}
        {{- range $dep := concat .app.harness.dependencies.hard .app.harness.dependencies.soft }}
        {{- $depApp := index $root.Values.apps $dep }}
        {{- if $depApp.harness.secrets }}
        - name: cloudharness-{{ $dep }}
          secret:
            secretName: {{ $dep }}
        {{- end }}
        {{- end }}
        {{- if .app.harness.deployment.volume }}
        - name: {{ .app.harness.deployment.volume.name }}
          persistentVolumeClaim:
            claimName: {{ .app.harness.deployment.volume.name }}
        {{- end }}
        {{ $app := .app }}
        {{- range $resource := .app.harness.resources }}
        - name: "{{ $app.harness.deployment.name }}-{{ $resource.name }}"
          configMap:
            name: "{{ $app.harness.deployment.name }}-{{ $resource.name }}"
        {{- end }}
        {{- if .app.harness.secrets }}
        - name: secrets
          secret:
            secretName: {{ .app.harness.deployment.name }}
        {{- end }}
        {{- if kindIs "map" .app.harness.database }}
          {{- if and (hasKey .app.harness.database "connect_string") .app.harness.database.connect_string }}
        - name: db-external
          secret:
            secretName: {{ printf "%s-db" .app.harness.deployment.name }}
          {{- end }}
        {{- end }}
---
{{- end }}

{{- define "deploy_utils.resource"}}
kind: ConfigMap
apiVersion: v1
metadata:
  name: "{{ .app.harness.deployment.name }}-{{ .resource.name }}"
  labels:
    app: {{ .app.harness.deployment.name | quote }}
  {{ include "deploy_utils.labels" .root | indent 4 }}
data:
  {{ base .resource.dst }}: {{ tpl (.root.Files.Get (print "resources/" .app.harness.deployment.name "/" .resource.src)) .root | quote }}
---
{{- end}}

{{- range $app := .Values.apps }}
  {{- if and (hasKey $app "port") $app.harness.deployment.auto | default false  }}
---
    {{- include "deploy_utils.deployment" (dict "root" $ "app" $app) }}
    {{- range $resource := $app.harness.resources }}
    {{- include "deploy_utils.resource" (dict "app" $app "resource" $resource "root" $) }}
    {{- end }}
  {{- end }}
  {{- range $subapp := $app }}
  {{- if contains "map" (typeOf $subapp)  }}
  {{- if hasKey $subapp "harness" }}
  {{- if and (hasKey $subapp "port") $subapp.harness.deployment.auto | default false }}
---
      {{- include "deploy_utils.deployment" (dict "root" $ "app" $subapp) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
 {{- end }}