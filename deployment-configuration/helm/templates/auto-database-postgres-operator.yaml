{{- define "deploy_utils.database.postgres.operator" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-credentials" .app.harness.database.name | quote }}
  namespace: {{ .root.Values.namespace }}
  labels:
    app: {{ .app.harness.database.name | quote }}
{{ include "deploy_utils.labels" .root | indent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .app.harness.database.user | quote }}
  password: {{ .app.harness.database.pass | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .app.harness.database.name | quote }}
  namespace: {{ .root.Values.namespace }}
  labels:
    app: {{ .app.harness.database.name | quote }}
{{ include "deploy_utils.labels" .root | indent 4 }}
spec:
  instances: {{ .app.harness.database.postgres.instances | default 1 }}

  inheritedMetadata:
    labels:
      app: {{ .app.harness.database.name | quote }}
      service: db

  bootstrap:
    initdb:
      database: {{ .app.harness.database.postgres.initialdb | quote }}
      owner: {{ .app.harness.database.user | quote }}
      secret:
        name: {{ printf "%s-credentials" .app.harness.database.name | quote }}

  storage:
    size: {{ .app.harness.database.size }}

  {{- $backup := .root.Values.backup }}
  {{- $offload := $backup.offload }}
  {{- $hasOffload := and $offload $offload.destinationPath }}
  {{- if and $backup.active $hasOffload }}
  backup:
    barmanObjectStore:
      destinationPath: {{ $offload.destinationPath | quote }}
      {{- with $offload.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      {{- if and $offload.s3.region $offload.s3.accessKeyId.name $offload.s3.secretAccessKey.name }}
      s3Credentials:
        accessKeyId:
          name: backup-offload-credentials
          key: {{ $offload.s3.accessKeyId.name | default "AWS_ACCESS_KEY_ID" }}
        secretAccessKey:
          name: backup-offload-credentials
          key: {{ $offload.s3.secretAccessKey.name | default "AWS_SECRET_ACCESS_KEY" }}
        region: {{ $offload.s3.region | quote }}
      {{- else if $offload.gcs.applicationCredentials.name }}
      googleCredentials:
        applicationCredentials:
          name: backup-offload-credentials
          key: {{ $offload.gcs.applicationCredentials.name | default "APPLICATION_CREDENTIALS" }}
      {{- end }}
    retentionPolicy: {{ $offload.retentionPolicy | default "30d" | quote }}
  {{- end }}

  {{- with .app.harness.database.resources }}
  resources:
    {{- with .requests }}
    requests:
      {{- with .memory }}
      memory: {{ . | quote }}
      {{- end }}
      {{- with .cpu }}
      cpu: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .limits }}
    limits:
      {{- with .memory }}
      memory: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}

  {{- if .app.harness.database.image_ref }}
  imageName: {{ index (index .app "task-images") .app.harness.database.image_ref | default ("Image ref not found!" | quote) }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .app.harness.database.name | quote }}
  namespace: {{ .root.Values.namespace }}
  labels:
    app: {{ .app.harness.deployment.name | quote }}
{{ include "deploy_utils.labels" .root | indent 4 }}
spec:
  type: {{ if .app.harness.database.expose }}LoadBalancer{{ else }}ClusterIP{{ end }}
  selector:
    app: {{ .app.harness.database.name | quote }}
    cnpg.io/instanceRole: primary
  ports:
  {{- range $port := .app.harness.database.postgres.ports }}
  - name: {{ $port.name }}
    port: {{ $port.port }}
    targetPort: 5432
  {{- end }}
{{- if and $backup.active $hasOffload }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ printf "%s-scheduled-backup" .app.harness.database.name | quote }}
  namespace: {{ .root.Values.namespace }}
  labels:
    app: {{ .app.harness.database.name | quote }}
{{ include "deploy_utils.labels" .root | indent 4 }}
spec:
  schedule: {{ $backup.schedule | default "0 0 0 * * *" | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ .app.harness.database.name | quote }}
{{- else if $backup.active }}
---
{{- include "deploy_utils.database.postgres.backup" (dict "root" .root "app" .app "postgresHost" (printf "%s-rw" .app.harness.database.name)) }}
{{- end }}
{{- end }}
