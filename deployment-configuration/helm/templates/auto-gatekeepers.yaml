{{/* Secured Services/Deployments */}}
{{- define "check_no_wildcard_uri" }}
{{- $check := true }}
{{- range .uri_role_mapping }}
  {{- if eq .uri "/*" }}
    {{- $check = false }}
  {{- end }}
{{- end }}
{{- $check }}
{{- end }}
{{- define "deploy_utils.securedservice" }}
{{- $tls := not (not .root.Values.tls) }}
{{- $noWildcards := include "check_no_wildcard_uri" (dict "uri_role_mapping" .app.harness.uri_role_mapping) }}
{{- $scheme := ternary "https" "http" $tls }}
{{- $readTimeout := .app.harness.proxy.timeout.read | default .root.Values.proxy.timeout.read | default 180 }}
{{- $sendTimeout := .app.harness.proxy.timeout.send | default .root.Values.proxy.timeout.send | default 180 }}
{{- $keepaliveTimeout := .app.harness.proxy.timeout.keepalive | default .root.Values.proxy.timeout.keepalive | default 180 }}
{{- $generatedGatekeeperConfiguration := dict
  "verbose" .root.Values.debug
  "discovery-url" (printf "%s://%s.%s/realms/%s" $scheme .root.Values.apps.accounts.harness.subdomain .root.Values.domain .root.Values.namespace)
  "client-id" .root.Values.apps.accounts.webclient.id
  "client-secret" .root.Values.apps.accounts.webclient.secret
  "secure-cookie" $tls
  "forbidden-page" "/templates/access-denied.html.tmpl"
  "enable-default-deny" (eq $noWildcards "true")
  "listen" "0.0.0.0:8080"
  "enable-encrypted-token" false
  "enable-refresh-tokens" true
  "server-write-timeout" (printf "%vs" $sendTimeout)
  "upstream-timeout" (printf "%vs" $readTimeout)
  "upstream-response-header-timeout" (printf "%vs" $readTimeout)
  "upstream-expect-continue-timeout" (printf "%vs" $readTimeout)
  "server-read-timeout" (printf "%vs" $readTimeout)
  "upstream-keepalive-timeout" (printf "%vs" $keepaliveTimeout)
  "http-only-cookie" false
  "tls-cert" ""
  "tls-private-key" ""
  "redirection-url" (printf "%s://%s.%s" $scheme .subdomain .root.Values.domain)
  "upstream-url" (printf "http://%s.%s:%v" .app.harness.service.name (.app.namespace | default .root.Release.Namespace) (.app.harness.service.port | default 80))
  "cors-origins" (list (printf "*.%s" .root.Values.domain))
  "cors-methods" (list "GET" "POST" "PUT" "DELETE" "PATCH")
  "cors-headers" (list "Authorization" "Content-Type" "Origin")
}}
{{- if and .app.harness.secured .app.harness.uri_role_mapping }}
{{- $_ := set $generatedGatekeeperConfiguration "resources" .app.harness.uri_role_mapping }}
{{- end }}
{{- if or .root.Values.local (not $tls) }}
{{- $_ := set $generatedGatekeeperConfiguration "skip-openid-provider-tls-verify" true }}
{{- $_ := set $generatedGatekeeperConfiguration "skip-upstream-tls-verify" true }}
{{- end }}
{{- $globalGatekeeperConfiguration := deepCopy (.root.Values.proxy.gatekeeper.configuration | default dict) }}
{{- $applicationGatekeeperConfiguration := deepCopy (.app.harness.proxy.gatekeeper.configuration | default dict) }}
{{- $gatekeeperConfiguration := mergeOverwrite $generatedGatekeeperConfiguration $globalGatekeeperConfiguration $applicationGatekeeperConfiguration }}
{{- if and (not $tls) (eq ((get $gatekeeperConfiguration "same-site-cookie") | toString) "None") }}
{{- $_ := set $gatekeeperConfiguration "same-site-cookie" "Lax" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .subdomain }}-gk"
  labels:
    app: "{{ .subdomain }}-gk"
data:
  proxy.yml: |-
{{ $gatekeeperConfiguration | toYaml | nindent 4 }}
  cacert.crt: {{ .files.Get "resources/certs/cacert.crt" | quote }}
  access-denied.html.tmpl: |-
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>403 - Access Forbidden</title>
      <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <style>
        .oops {
          font-size: 9em;
          letter-spacing: 2px;
        }
        .message {
          font-size: 3em;
        }
        .error-template {
          display: none;
        }
      </style>
    </head>
    <body>
      <div class="container text-center">
        <div class="row vcenter" style="margin-top: 20%;">
          <div class="col-md-12">
            <div class="error-template" id="error-template">
              <h1 class="oops">Oops!</h1>
              <h2 class="message">403 Permission Denied</h2>
              <div class="error-details">
                Sorry, you do not have access to this page, please contact your administrator.
                If you are authorized to see this page, please try <a href="/">reload</a>
                or <a href="/oauth/logout?redirect=/">login again</a>.
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        var retryKey = 'gk_403_retry';
        var retryCount = parseInt(sessionStorage.getItem(retryKey) || '0', 10);

        if (retryCount < 1) {
          sessionStorage.setItem(retryKey, String(retryCount + 1));
          setTimeout(function() {
            window.location.replace('/');
          }, 100);
        } else {
          sessionStorage.removeItem(retryKey);
          document.getElementById('error-template').style.display = 'block';
        }
      </script>
    </body>
    </html>
---
{{- $gkSecretName := printf "%s-gk" .subdomain }}
{{- $existingGkSecret := (lookup "v1" "Secret" .root.Values.namespace $gkSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gkSecretName }}
  namespace: {{ .root.Values.namespace }}
  labels:
    app: {{ $gkSecretName }}
type: Opaque
stringData:
  updated: {{ now | quote }}
  {{- if .root.Values.proxy.gatekeeper.secret }}
  encryption-key: {{ .root.Values.proxy.gatekeeper.secret | quote }}
  {{- else }}
    {{- $hasExisting := false }}
    {{- if $existingGkSecret }}
      {{- if eq (typeOf $existingGkSecret.data) (typeOf dict) }}
        {{- if hasKey $existingGkSecret.data "encryption-key" }}
          {{- $hasExisting = true }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if not $hasExisting }}
  encryption-key: {{ randAlphaNum 32 | quote }}
    {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .subdomain }}-gk"
  labels:
    app: "{{ .subdomain  }}-gk"
spec:
  ports:
  - name: http
    port: 8080
  selector:
    app: "{{ .subdomain  }}-gk"
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .subdomain  }}-gk"
  labels:
    app: "{{ .subdomain  }}-gk"
spec:
  replicas: {{ .app.harness.proxy.gatekeeper.replicas | default .root.Values.proxy.gatekeeper.replicas | default 5 }}
  selector:
    matchLabels:
      app: "{{ .subdomain  }}-gk"
  template:
    metadata:
      annotations:
        checksum/config: {{ $gatekeeperConfiguration | toJson | sha256sum }}
      labels:
        app: "{{ .subdomain  }}-gk"
    spec:
{{ include "deploy_utils.etcHosts" .root | indent 6 }}
      containers:
      - name: {{ .app.harness.service.name | quote }}
        image: {{ .app.harness.proxy.gatekeeper.image | default .root.Values.proxy.gatekeeper.image | default "quay.io/gogatekeeper/gatekeeper:4.6.0" }}
        imagePullPolicy: IfNotPresent
        {{ if .root.Values.local }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        {{- end }}
        env:
        - name: PROXY_CONFIG_FILE
          value: /opt/proxy.yml
        - name: PROXY_ENABLE_METRICS
          value: "true"
        - name: PROXY_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .subdomain }}-gk"
              key: encryption-key
        volumeMounts:
        - name: "{{ .subdomain  }}-gk-proxy-config"
          mountPath: /opt/proxy.yml
          subPath: proxy.yml
        - name: "{{ .subdomain  }}-gk-proxy-config"
          mountPath: /etc/pki/ca-trust/source/anchors/cacert.crt
          subPath: cacert.crt
        - name: "{{ .subdomain }}-gk-proxy-config"
          mountPath: /templates/access-denied.html.tmpl
          subPath: access-denied.html.tmpl
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        resources:
{{ .app.harness.proxy.gatekeeper.resources | default .root.Values.proxy.gatekeeper.resources | toYaml | nindent 10 }}
      volumes:
      - name: "{{ .subdomain  }}-gk-proxy-config"
        configMap:
          name: "{{ .subdomain  }}-gk"
---
{{- end }}
{{- if .Values.secured_gatekeepers }}
{{ $files := .Files }}
{{- range $app := .Values.apps }}
  {{- if and (hasKey $app "port") ($app.harness.secured)   }}
---
    {{ include "deploy_utils.securedservice" (dict "root" $ "app" $app "files" $files "subdomain" $app.harness.subdomain) }}
  {{- end }}
  {{- if and $app.harness.aliases $app.harness.secured }}
    {{- range $subdomain := $app.harness.aliases }}
      {{ include "deploy_utils.securedservice" (dict "root" $ "app" $app "files" $files "subdomain" $subdomain ) }}
    {{- end }}
  {{- end }}
  {{- range $subapp := $app }}
  {{- if contains "map" (typeOf $subapp)  }}
    {{- if and (hasKey $subapp "harness.port") (hasKey $subapp "harness.secured") }}
      {{- if $subapp.harness.secured }}
---
      {{ include "deploy_utils.securedservice" (dict "root" $ "app" $subapp "files" $files) }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
 {{- end }}
{{- end }}
