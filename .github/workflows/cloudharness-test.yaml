            CLOUDHARNESS_DJANGO=${{ vars.REGISTRY }}/cloud-harness/cloudharness-django:${{ needs.prepare.outputs.CLOUDHARNESS_DJANGO_TAG }}
            KEYCLOAK=quay.io/keycloak/keycloak:26.5
            GOLANG=golang:1.26
            ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
            NODE=node:22-alpine
            PYTHON=python:3.12-slim-trixie
