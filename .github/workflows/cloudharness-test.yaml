          tags: |-
            ${{ vars.REGISTRY }}/cloud-harness/sampleapp:${{ needs.prepare.outputs.SAMPLES_TAG }}
            ${{ vars.REGISTRY }}/cloud-harness/sampleapp:${{ needs.prepare.outputs.branch_tag }}
        if: ${{ steps.check.outputs.exists != 'true' || needs.prepare.outputs.force_build == 'all' || contains(format(',{0},', needs.prepare.outputs.force_build), ',samples,') }}
    if: ${{ (needs.prepare.outputs.SAMPLES_TAG_EXISTS != '1') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success') }}
