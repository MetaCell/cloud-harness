    name: Wait for the deployment
    needs:
      - prepare
      - deploy
    if: ${{ (needs.prepare.outputs.skip_tests != 'true') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' && needs.deploy.result == 'success') }}
    timeout-minutes: 15
    env:
      NAMESPACE: ${{ needs.prepare.outputs.namespace }}
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            mkdir -p "$HOME/.kube"
            echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          elif [ -n "$KUBERNETES_SERVICE_HOST" ] || kubectl config current-context > /dev/null 2>&1; then
            echo "Using the runner's ambient cluster access"
          else
            echo "::error::No cluster access: set the KUBECONFIG secret (base64 kubeconfig) where this job can read it, or run on a runner inside the target cluster"
            exit 1
          fi
      - name: Select the namespace
        run: kubectl config set-context --current --namespace="$NAMESPACE"
      - name: Wait for the rollouts
        run: |
          kubectl rollout status deployment/accounts
          kubectl rollout status deployment/argo-gk
          kubectl rollout status deployment/common
          kubectl rollout status statefulset/samples
          kubectl rollout status deployment/www-gk
          kubectl rollout status deployment/samples-instance1
          kubectl rollout status deployment/samples1-gk
          kubectl rollout status deployment/volumemanager
          kubectl rollout status deployment/workflows
          sleep 60
