          context: ./applications/samples/tasks/print-file
          file: ./applications/samples/tasks/print-file/Dockerfile
          build-args: |-
            NOCACHE=${{ github.run_id }}
            CLOUDHARNESS_BASE=${{ vars.REGISTRY }}/cloud-harness/cloudharness-base:${{ needs.prepare.outputs.CLOUDHARNESS_BASE_TAG }}
