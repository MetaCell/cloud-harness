            GOLANG=golang:1.26
            ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
            NODE=node:22-alpine
            PYTHON=python:3.12-slim-trixie
            GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
          tags: |-
            ${{ vars.REGISTRY }}/cloud-harness/sampleapp-print-file:${{ needs.prepare.outputs.SAMPLES_PRINT_FILE_TAG }}
