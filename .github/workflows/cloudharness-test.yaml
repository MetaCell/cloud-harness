          cache-to: type=registry,ref=${{ vars.REGISTRY }}/cloud-harness/nfsserver:buildcache,mode=max
          context: ./applications/nfsserver
          file: ./applications/nfsserver/Dockerfile
          build-args: |-
            NOCACHE=${{ github.run_id }}
            KEYCLOAK=quay.io/keycloak/keycloak:26.5
            GOLANG=golang:1.26
            ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
            NODE=node:22-alpine
            PYTHON=python:3.12-slim-trixie
            GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
          tags: |-
            ${{ vars.REGISTRY }}/cloud-harness/nfsserver:${{ needs.prepare.outputs.NFSSERVER_TAG }}
            ${{ vars.REGISTRY }}/cloud-harness/nfsserver:${{ needs.prepare.outputs.branch_tag }}
        if: ${{ steps.check.outputs.exists != 'true' || needs.prepare.outputs.force_build == 'all' || contains(format(',{0},', needs.prepare.outputs.force_build), ',nfsserver,') }}
    if: ${{ (needs.prepare.outputs.NFSSERVER_TAG_EXISTS != '1') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
  build-samples:
    name: Build samples
    needs:
      - prepare
      - build-cloudharness-flask
      - build-cloudharness-frontend-build
      - build-cloudharness-django
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
