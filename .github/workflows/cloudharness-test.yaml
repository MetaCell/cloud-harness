# Generated with: harness-deployment . -i samples -e test -ci github
name: CloudHarness test
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      force_build:
        description: Comma-separated image names to rebuild even if their tag already exists, or `all`
        type: string
        default: ''
      skip_tests:
        description: Set to `true` to skip the tests
        type: string
        default: ''
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CLOUDHARNESS_BRANCH: ${{ vars.CLOUDHARNESS_BRANCH || 'develop' }}
jobs:
  prepare:
    name: Prepare and build
    env:
      NAMESPACE: test-${{ vars.NAMESPACE_BASENAME }}
      DOMAIN: ${{ vars.DOMAIN }}
      REGISTRY: ${{ vars.REGISTRY }}
      REGISTRY_SECRET: ${{ vars.REGISTRY_SECRET }}
      IMAGE_CACHE_URL: ${{ vars.IMAGE_CACHE_URL }}
      CHART_NAME: ${{ vars.CHART_NAME }}
      CHART_VERSION: ${{ vars.CHART_VERSION }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      PUBLISH_TAG: ${{ inputs.publish_tag || vars.DEPLOYMENT_PUBLISH_TAG }}
      DEPLOYMENT_TAG: ${{ inputs.deployment_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      SKIP_TESTS: ${{ inputs.skip_tests || vars.SKIP_TESTS }}
      FORCE_BUILD: ${{ inputs.force_build }}
    outputs:
      branch_tag: ${{ steps.env.outputs.branch_tag }}
      short_sha: ${{ steps.env.outputs.short_sha }}
      registry_host: ${{ steps.env.outputs.registry_host }}
      namespace: ${{ steps.env.outputs.namespace }}
      publish_tag: ${{ steps.env.outputs.publish_tag }}
      deployment_tag: ${{ steps.env.outputs.deployment_tag }}
      skip_tests: ${{ steps.env.outputs.skip_tests }}
      force_build: ${{ steps.env.outputs.force_build }}
      ACCOUNTS_TAG: ${{ steps.images.outputs.ACCOUNTS_TAG }}
      ACCOUNTS_TAG_EXISTS: ${{ steps.images.outputs.ACCOUNTS_TAG_EXISTS }}
      COMMON_TAG: ${{ steps.images.outputs.COMMON_TAG }}
      COMMON_TAG_EXISTS: ${{ steps.images.outputs.COMMON_TAG_EXISTS }}
      JUPYTERHUB_TAG: ${{ steps.images.outputs.JUPYTERHUB_TAG }}
      JUPYTERHUB_TAG_EXISTS: ${{ steps.images.outputs.JUPYTERHUB_TAG_EXISTS }}
      NFSSERVER_TAG: ${{ steps.images.outputs.NFSSERVER_TAG }}
      NFSSERVER_TAG_EXISTS: ${{ steps.images.outputs.NFSSERVER_TAG_EXISTS }}
      SAMPLES_TAG: ${{ steps.images.outputs.SAMPLES_TAG }}
      SAMPLES_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_TAG_EXISTS }}
      SAMPLES_INSTANCE1_TAG: ${{ steps.images.outputs.SAMPLES_INSTANCE1_TAG }}
      SAMPLES_INSTANCE1_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_INSTANCE1_TAG_EXISTS }}
      VOLUMEMANAGER_TAG: ${{ steps.images.outputs.VOLUMEMANAGER_TAG }}
      VOLUMEMANAGER_TAG_EXISTS: ${{ steps.images.outputs.VOLUMEMANAGER_TAG_EXISTS }}
      WORKFLOWS_TAG: ${{ steps.images.outputs.WORKFLOWS_TAG }}
      WORKFLOWS_TAG_EXISTS: ${{ steps.images.outputs.WORKFLOWS_TAG_EXISTS }}
      CLOUDHARNESS_FLASK_TAG: ${{ steps.images.outputs.CLOUDHARNESS_FLASK_TAG }}
      CLOUDHARNESS_FLASK_TAG_EXISTS: ${{ steps.images.outputs.CLOUDHARNESS_FLASK_TAG_EXISTS }}
      CLOUDHARNESS_BASE_TAG: ${{ steps.images.outputs.CLOUDHARNESS_BASE_TAG }}
      CLOUDHARNESS_BASE_TAG_EXISTS: ${{ steps.images.outputs.CLOUDHARNESS_BASE_TAG_EXISTS }}
      CLOUDHARNESS_DJANGO_TAG: ${{ steps.images.outputs.CLOUDHARNESS_DJANGO_TAG }}
      CLOUDHARNESS_DJANGO_TAG_EXISTS: ${{ steps.images.outputs.CLOUDHARNESS_DJANGO_TAG_EXISTS }}
      CLOUDHARNESS_FRONTEND_BUILD_TAG: ${{ steps.images.outputs.CLOUDHARNESS_FRONTEND_BUILD_TAG }}
      CLOUDHARNESS_FRONTEND_BUILD_TAG_EXISTS: ${{ steps.images.outputs.CLOUDHARNESS_FRONTEND_BUILD_TAG_EXISTS }}
      SAMPLES_PRINT_FILE_TAG: ${{ steps.images.outputs.SAMPLES_PRINT_FILE_TAG }}
      SAMPLES_PRINT_FILE_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_PRINT_FILE_TAG_EXISTS }}
      SAMPLES_SUM_TAG: ${{ steps.images.outputs.SAMPLES_SUM_TAG }}
      SAMPLES_SUM_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_SUM_TAG_EXISTS }}
      SAMPLES_SECRET_TAG: ${{ steps.images.outputs.SAMPLES_SECRET_TAG }}
      SAMPLES_SECRET_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_SECRET_TAG_EXISTS }}
      WORKFLOWS_NOTIFY_QUEUE_TAG: ${{ steps.images.outputs.WORKFLOWS_NOTIFY_QUEUE_TAG }}
      WORKFLOWS_NOTIFY_QUEUE_TAG_EXISTS: ${{ steps.images.outputs.WORKFLOWS_NOTIFY_QUEUE_TAG_EXISTS }}
      WORKFLOWS_SEND_RESULT_EVENT_TAG: ${{ steps.images.outputs.WORKFLOWS_SEND_RESULT_EVENT_TAG }}
      WORKFLOWS_SEND_RESULT_EVENT_TAG_EXISTS: ${{ steps.images.outputs.WORKFLOWS_SEND_RESULT_EVENT_TAG_EXISTS }}
      WORKFLOWS_EXTRACT_DOWNLOAD_TAG: ${{ steps.images.outputs.WORKFLOWS_EXTRACT_DOWNLOAD_TAG }}
      WORKFLOWS_EXTRACT_DOWNLOAD_TAG_EXISTS: ${{ steps.images.outputs.WORKFLOWS_EXTRACT_DOWNLOAD_TAG_EXISTS }}
      TEST_API_TAG: ${{ steps.images.outputs.TEST_API_TAG }}
      TEST_API_TAG_EXISTS: ${{ steps.images.outputs.TEST_API_TAG_EXISTS }}
      TEST_E2E_TAG: ${{ steps.images.outputs.TEST_E2E_TAG }}
      TEST_E2E_TAG_EXISTS: ${{ steps.images.outputs.TEST_E2E_TAG_EXISTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
      - name: Install cloud-harness tools
        run: bash cloud-harness/install.sh
      - name: Resolve pipeline variables
        id: env
        run: |
          branch_tag=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-128)
          {
            echo "branch_tag=$branch_tag"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "registry_host=${REGISTRY%%/*}"
            echo "namespace=$NAMESPACE"
            echo "publish_tag=$PUBLISH_TAG"
            echo "deployment_tag=$DEPLOYMENT_TAG"
            echo "skip_tests=$SKIP_TESTS"
            echo "force_build=$FORCE_BUILD"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare helm chart
        id: images
        run: |
          HELM_META_ARGS=""
          if [ -n "$CHART_NAME" ]; then HELM_META_ARGS="$HELM_META_ARGS --name $CHART_NAME"; fi
          if [ -n "$CHART_VERSION" ]; then HELM_META_ARGS="$HELM_META_ARGS --chart-version $CHART_VERSION"; fi
          APP_VERSION_RESOLVED="${APP_VERSION:-$DEPLOYMENT_TAG}"
          if [ -n "$APP_VERSION_RESOLVED" ]; then HELM_META_ARGS="$HELM_META_ARGS --app-version $APP_VERSION_RESOLVED"; fi
          TAG_ARG=""
          if [ -n "$DEPLOYMENT_TAG" ]; then TAG_ARG="-t $DEPLOYMENT_TAG"; fi
          harness-deployment . -d "$DOMAIN" -r "$REGISTRY" -rsn "$REGISTRY_SECRET" -n "$NAMESPACE" -e test $TAG_ARG --write-env --write-skaffold-ci --cache-url "$IMAGE_CACHE_URL" --force-build "$FORCE_BUILD" -N $HELM_META_ARGS -i samples
          cat deployment/.env >> "$GITHUB_OUTPUT"
      - name: View helm chart
        run: helm template ./deployment/helm --debug -n "$NAMESPACE"
      - name: Share the deployment with the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: cloudharness-deployment
          path: deployment
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.env.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Install skaffold
        env:
          SKAFFOLD_VERSION: v2.25.0
          SKAFFOLD_SHA256: 42b9e2e3246c19b78fcc53dd60cc7ded1da8704293886b909a2a02b9bef34d20
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/skaffold" "https://github.com/GoogleContainerTools/skaffold/releases/download/$SKAFFOLD_VERSION/skaffold-linux-amd64"
          echo "$SKAFFOLD_SHA256  $RUNNER_TEMP/bin/skaffold" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/skaffold"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and push the images
        env:
          NOCACHE: ${{ github.run_id }}
          CH_BRANCH_TAG: ${{ steps.env.outputs.branch_tag }}
        run: skaffold build --filename deployment/skaffold-ci.yaml --cache-artifacts=false --update-check=false --interactive=false
      - name: Run the unit tests
        run: skaffold test --filename deployment/skaffold-ci.yaml --build-artifacts deployment/skaffold-images.json --update-check=false --interactive=false
    runs-on: ${{ vars.CH_GITHUB_BUILD_RUNNER || vars.CH_GITHUB_RUNNER || 'ubuntu-latest' }}
  deploy:
    name: Deploy
    needs:
      - prepare
    environment: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: deployment
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            mkdir -p "$HOME/.kube"
            echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          elif [ -n "$KUBERNETES_SERVICE_HOST" ] || kubectl config current-context > /dev/null 2>&1; then
            echo "Using the runner's ambient cluster access"
          else
            echo "::error::No cluster access: set the KUBECONFIG secret (base64 kubeconfig) where this job can read it, or run on a runner inside the target cluster"
            exit 1
          fi
      - name: Write the secret values
        env:
          ASECRET: ${{ secrets.ASECRET }}
        run: |
          set -e
          secrets_dir="$HOME/.cloudharness/secrets"
          mkdir -p "$secrets_dir"
          chmod 700 "$secrets_dir"
          printf '%s' "$ASECRET" > "$secrets_dir/ASECRET"
      - name: Install skaffold
        env:
          SKAFFOLD_VERSION: v2.25.0
          SKAFFOLD_SHA256: 42b9e2e3246c19b78fcc53dd60cc7ded1da8704293886b909a2a02b9bef34d20
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/skaffold" "https://github.com/GoogleContainerTools/skaffold/releases/download/$SKAFFOLD_VERSION/skaffold-linux-amd64"
          echo "$SKAFFOLD_SHA256  $RUNNER_TEMP/bin/skaffold" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/skaffold"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Deploy and wait for the rollout
        run: skaffold deploy --filename deployment/skaffold-ci.yaml --build-artifacts deployment/skaffold-images.json --label skaffold.dev/run-id=cloudharness --update-check=false --interactive=false
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' }}
    runs-on: ${{ vars.CH_GITHUB_RUNNER || 'ubuntu-latest' }}
  tests-api-common:
    name: API tests common
    needs:
      - prepare
      - deploy
    if: ${{ (needs.prepare.outputs.skip_tests != 'true') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' && needs.deploy.result == 'success') }}
    steps:
      - name: Give the certificates time to settle
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: deployment
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Run common API tests
        env:
          APP_URL: https://common.${{ vars.DOMAIN }}/api
          CH_TEST_IMAGE: ${{ vars.REGISTRY }}/cloud-harness/test-api:${{ needs.prepare.outputs.TEST_API_TAG }}
          CH_TEST_COMMANDS: |
            set -e
            st --pre-run cloudharness_test.apitest_init run api/openapi.yaml --base-url https://common.${{ vars.DOMAIN }}/api -c all
        run: |-
          docker run --rm \
            -e APP_URL \
            -v "$GITHUB_WORKSPACE/applications/common:/home/test" \
            -v "$GITHUB_WORKSPACE/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml" \
            -w /home/test \
            "$CH_TEST_IMAGE" sh -c "$CH_TEST_COMMANDS"
    runs-on: ${{ vars.CH_GITHUB_RUNNER || 'ubuntu-latest' }}
  tests-api-samples:
    name: API tests samples
    needs:
      - prepare
      - deploy
    if: ${{ (needs.prepare.outputs.skip_tests != 'true') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' && needs.deploy.result == 'success') }}
    steps:
      - name: Give the certificates time to settle
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: deployment
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Run samples API tests
        env:
          APP_URL: https://www.${{ vars.DOMAIN }}/api
          USERNAME: sample@testuser.com
          PASSWORD: test
          CH_TEST_IMAGE: ${{ vars.REGISTRY }}/cloud-harness/test-api:${{ needs.prepare.outputs.TEST_API_TAG }}
          CH_TEST_COMMANDS: |
            set -e
            st --pre-run cloudharness_test.apitest_init run api/openapi.yaml --base-url https://www.${{ vars.DOMAIN }}/api -c all --skip-deprecated-operations --exclude-operation-id=submit_sync --exclude-operation-id=submit_sync_with_results --exclude-operation-id=error --hypothesis-suppress-health-check=too_slow --hypothesis-deadline=180000 --request-timeout=180000 --hypothesis-max-examples=2 --show-trace --exclude-checks=ignored_auth
            pytest -v test/api
        run: |-
          docker run --rm \
            -e APP_URL \
            -e USERNAME \
            -e PASSWORD \
            -v "$GITHUB_WORKSPACE/applications/samples:/home/test" \
            -v "$GITHUB_WORKSPACE/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml" \
            -w /home/test \
            "$CH_TEST_IMAGE" sh -c "$CH_TEST_COMMANDS"
    runs-on: ${{ vars.CH_GITHUB_RUNNER || 'ubuntu-latest' }}
  tests-api-workflows:
    name: API tests workflows
    needs:
      - prepare
      - deploy
    if: ${{ (needs.prepare.outputs.skip_tests != 'true') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' && needs.deploy.result == 'success') }}
    steps:
      - name: Give the certificates time to settle
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: deployment
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Run workflows API tests
        env:
          APP_URL: https://workflows.${{ vars.DOMAIN }}/api
          CH_TEST_IMAGE: ${{ vars.REGISTRY }}/cloud-harness/test-api:${{ needs.prepare.outputs.TEST_API_TAG }}
          CH_TEST_COMMANDS: |
            set -e
            st --pre-run cloudharness_test.apitest_init run api/openapi.yaml --base-url https://workflows.${{ vars.DOMAIN }}/api -c all
        run: |-
          docker run --rm \
            -e APP_URL \
            -v "$GITHUB_WORKSPACE/applications/workflows:/home/test" \
            -v "$GITHUB_WORKSPACE/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml" \
            -w /home/test \
            "$CH_TEST_IMAGE" sh -c "$CH_TEST_COMMANDS"
    runs-on: ${{ vars.CH_GITHUB_RUNNER || 'ubuntu-latest' }}
  tests-e2e-jupyterhub:
    name: E2E tests jupyterhub
    needs:
      - prepare
      - deploy
    if: ${{ (needs.prepare.outputs.skip_tests != 'true') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' && needs.deploy.result == 'success') }}
    steps:
      - name: Give the certificates time to settle
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Run jupyterhub E2E tests
        env:
          APP_URL: https://hub.${{ vars.DOMAIN }}
          CH_TEST_IMAGE: ${{ vars.REGISTRY }}/cloud-harness/test-e2e:${{ needs.prepare.outputs.TEST_E2E_TAG }}
          CH_TEST_COMMANDS: |
            set -e
            npx puppeteer browsers install chrome
            yarn test
        run: |-
          docker run --rm \
            -e APP_URL \
            -v "$GITHUB_WORKSPACE/applications/jupyterhub/test/e2e:/home/test/__tests__/jupyterhub" \
            -w /home/test \
            "$CH_TEST_IMAGE" sh -c "$CH_TEST_COMMANDS"
    runs-on: ${{ vars.CH_GITHUB_RUNNER || 'ubuntu-latest' }}
  tests-e2e-samples:
    name: E2E tests samples
    needs:
      - prepare
      - deploy
    if: ${{ (needs.prepare.outputs.skip_tests != 'true') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success' && needs.deploy.result == 'success') }}
    steps:
      - name: Give the certificates time to settle
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Run samples E2E tests
        env:
          APP_URL: https://www.${{ vars.DOMAIN }}
          USERNAME: sample@testuser.com
          PASSWORD: test
          CH_TEST_IMAGE: ${{ vars.REGISTRY }}/cloud-harness/test-e2e:${{ needs.prepare.outputs.TEST_E2E_TAG }}
          CH_TEST_COMMANDS: |
            set -e
            npx puppeteer browsers install chrome
            yarn test
        run: |-
          docker run --rm \
            -e APP_URL \
            -e USERNAME \
            -e PASSWORD \
            -v "$GITHUB_WORKSPACE/applications/samples/test/e2e:/home/test/__tests__/samples" \
            -w /home/test \
            "$CH_TEST_IMAGE" sh -c "$CH_TEST_COMMANDS"
    runs-on: ${{ vars.CH_GITHUB_RUNNER || 'ubuntu-latest' }}
  cleanup:
    name: Delete the test deployment
    needs:
      - prepare
      - deploy
      - tests-api-common
      - tests-api-samples
      - tests-api-workflows
      - tests-e2e-jupyterhub
      - tests-e2e-samples
    if: ${{ always() && needs.deploy.result == 'success' }}
    env:
      NAMESPACE: ${{ needs.prepare.outputs.namespace }}
      WAIT_ON_FAIL: ${{ vars.WAIT_ON_FAIL || '0' }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
    steps:
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            mkdir -p "$HOME/.kube"
            echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          elif [ -n "$KUBERNETES_SERVICE_HOST" ] || kubectl config current-context > /dev/null 2>&1; then
            echo "Using the runner's ambient cluster access"
          else
            echo "::error::No cluster access: set the KUBECONFIG secret (base64 kubeconfig) where this job can read it, or run on a runner inside the target cluster"
            exit 1
          fi
      - name: Uninstall the release and delete the namespace
        run: |
          if [ "$FAILED" = "true" ] && [ "$WAIT_ON_FAIL" != "0" ]; then
            echo "Tests failed: keeping the deployment for $WAIT_ON_FAIL minutes for inspection"
            sleep $((WAIT_ON_FAIL * 60))
          fi
          helm uninstall "$NAMESPACE" -n "$NAMESPACE" || true
          kubectl delete namespace "$NAMESPACE" --ignore-not-found
    runs-on: ${{ vars.CH_GITHUB_RUNNER || 'ubuntu-latest' }}
