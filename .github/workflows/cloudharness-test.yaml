# Generated with: harness-deployment . -i samples -e test -ci github
name: CloudHarness test
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      force_build:
        description: Comma-separated image names to rebuild even if their tag already exists, or `all`
        type: string
        default: ''
      skip_tests:
        description: Set to `true` to skip the tests
        type: string
        default: ''
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CLOUDHARNESS_BRANCH: ${{ vars.CLOUDHARNESS_BRANCH || 'develop' }}
jobs:
  prepare:
    name: Prepare helm chart
    env:
      NAMESPACE: test-${{ vars.NAMESPACE_BASENAME }}
      DOMAIN: ${{ vars.DOMAIN }}
      REGISTRY: ${{ vars.REGISTRY }}
      REGISTRY_SECRET: ${{ vars.REGISTRY_SECRET }}
      IMAGE_CACHE_URL: ${{ vars.IMAGE_CACHE_URL }}
      CHART_NAME: ${{ vars.CHART_NAME }}
      CHART_VERSION: ${{ vars.CHART_VERSION }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      PUBLISH_TAG: ${{ inputs.publish_tag || vars.DEPLOYMENT_PUBLISH_TAG }}
      DEPLOYMENT_TAG: ${{ inputs.deployment_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      SKIP_TESTS: ${{ inputs.skip_tests || vars.SKIP_TESTS }}
      FORCE_BUILD: ${{ inputs.force_build }}
    outputs:
      branch_tag: ${{ steps.env.outputs.branch_tag }}
      short_sha: ${{ steps.env.outputs.short_sha }}
      registry_host: ${{ steps.env.outputs.registry_host }}
      namespace: ${{ steps.env.outputs.namespace }}
      publish_tag: ${{ steps.env.outputs.publish_tag }}
      deployment_tag: ${{ steps.env.outputs.deployment_tag }}
      skip_tests: ${{ steps.env.outputs.skip_tests }}
      force_build: ${{ steps.env.outputs.force_build }}
      ACCOUNTS_TAG: ${{ steps.images.outputs.ACCOUNTS_TAG }}
      ACCOUNTS_TAG_EXISTS: ${{ steps.images.outputs.ACCOUNTS_TAG_EXISTS }}
      COMMON_TAG: ${{ steps.images.outputs.COMMON_TAG }}
      COMMON_TAG_EXISTS: ${{ steps.images.outputs.COMMON_TAG_EXISTS }}
      JUPYTERHUB_TAG: ${{ steps.images.outputs.JUPYTERHUB_TAG }}
      JUPYTERHUB_TAG_EXISTS: ${{ steps.images.outputs.JUPYTERHUB_TAG_EXISTS }}
      NFSSERVER_TAG: ${{ steps.images.outputs.NFSSERVER_TAG }}
      NFSSERVER_TAG_EXISTS: ${{ steps.images.outputs.NFSSERVER_TAG_EXISTS }}
      SAMPLES_TAG: ${{ steps.images.outputs.SAMPLES_TAG }}
      SAMPLES_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_TAG_EXISTS }}
      SAMPLES_INSTANCE1_TAG: ${{ steps.images.outputs.SAMPLES_INSTANCE1_TAG }}
      SAMPLES_INSTANCE1_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_INSTANCE1_TAG_EXISTS }}
      VOLUMEMANAGER_TAG: ${{ steps.images.outputs.VOLUMEMANAGER_TAG }}
      VOLUMEMANAGER_TAG_EXISTS: ${{ steps.images.outputs.VOLUMEMANAGER_TAG_EXISTS }}
      WORKFLOWS_TAG: ${{ steps.images.outputs.WORKFLOWS_TAG }}
      WORKFLOWS_TAG_EXISTS: ${{ steps.images.outputs.WORKFLOWS_TAG_EXISTS }}
      CLOUDHARNESS_FLASK_TAG: ${{ steps.images.outputs.CLOUDHARNESS_FLASK_TAG }}
      CLOUDHARNESS_FLASK_TAG_EXISTS: ${{ steps.images.outputs.CLOUDHARNESS_FLASK_TAG_EXISTS }}
      CLOUDHARNESS_BASE_TAG: ${{ steps.images.outputs.CLOUDHARNESS_BASE_TAG }}
      CLOUDHARNESS_BASE_TAG_EXISTS: ${{ steps.images.outputs.CLOUDHARNESS_BASE_TAG_EXISTS }}
      CLOUDHARNESS_DJANGO_TAG: ${{ steps.images.outputs.CLOUDHARNESS_DJANGO_TAG }}
      CLOUDHARNESS_DJANGO_TAG_EXISTS: ${{ steps.images.outputs.CLOUDHARNESS_DJANGO_TAG_EXISTS }}
      CLOUDHARNESS_FRONTEND_BUILD_TAG: ${{ steps.images.outputs.CLOUDHARNESS_FRONTEND_BUILD_TAG }}
      CLOUDHARNESS_FRONTEND_BUILD_TAG_EXISTS: ${{ steps.images.outputs.CLOUDHARNESS_FRONTEND_BUILD_TAG_EXISTS }}
      SAMPLES_PRINT_FILE_TAG: ${{ steps.images.outputs.SAMPLES_PRINT_FILE_TAG }}
      SAMPLES_PRINT_FILE_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_PRINT_FILE_TAG_EXISTS }}
      SAMPLES_SUM_TAG: ${{ steps.images.outputs.SAMPLES_SUM_TAG }}
      SAMPLES_SUM_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_SUM_TAG_EXISTS }}
      SAMPLES_SECRET_TAG: ${{ steps.images.outputs.SAMPLES_SECRET_TAG }}
      SAMPLES_SECRET_TAG_EXISTS: ${{ steps.images.outputs.SAMPLES_SECRET_TAG_EXISTS }}
      WORKFLOWS_NOTIFY_QUEUE_TAG: ${{ steps.images.outputs.WORKFLOWS_NOTIFY_QUEUE_TAG }}
      WORKFLOWS_NOTIFY_QUEUE_TAG_EXISTS: ${{ steps.images.outputs.WORKFLOWS_NOTIFY_QUEUE_TAG_EXISTS }}
      WORKFLOWS_SEND_RESULT_EVENT_TAG: ${{ steps.images.outputs.WORKFLOWS_SEND_RESULT_EVENT_TAG }}
      WORKFLOWS_SEND_RESULT_EVENT_TAG_EXISTS: ${{ steps.images.outputs.WORKFLOWS_SEND_RESULT_EVENT_TAG_EXISTS }}
      WORKFLOWS_EXTRACT_DOWNLOAD_TAG: ${{ steps.images.outputs.WORKFLOWS_EXTRACT_DOWNLOAD_TAG }}
      WORKFLOWS_EXTRACT_DOWNLOAD_TAG_EXISTS: ${{ steps.images.outputs.WORKFLOWS_EXTRACT_DOWNLOAD_TAG_EXISTS }}
      TEST_API_TAG: ${{ steps.images.outputs.TEST_API_TAG }}
      TEST_API_TAG_EXISTS: ${{ steps.images.outputs.TEST_API_TAG_EXISTS }}
      TEST_E2E_TAG: ${{ steps.images.outputs.TEST_E2E_TAG }}
      TEST_E2E_TAG_EXISTS: ${{ steps.images.outputs.TEST_E2E_TAG_EXISTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
      - name: Install cloud-harness tools
        run: bash cloud-harness/install.sh
      - name: Resolve pipeline variables
        id: env
        run: |
          branch_tag=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-128)
          {
            echo "branch_tag=$branch_tag"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "registry_host=${REGISTRY%%/*}"
            echo "namespace=$NAMESPACE"
            echo "publish_tag=$PUBLISH_TAG"
            echo "deployment_tag=$DEPLOYMENT_TAG"
            echo "skip_tests=$SKIP_TESTS"
            echo "force_build=$FORCE_BUILD"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare helm chart
        id: images
        run: |
          HELM_META_ARGS=""
          if [ -n "$CHART_NAME" ]; then HELM_META_ARGS="$HELM_META_ARGS --name $CHART_NAME"; fi
          if [ -n "$CHART_VERSION" ]; then HELM_META_ARGS="$HELM_META_ARGS --chart-version $CHART_VERSION"; fi
          APP_VERSION_RESOLVED="${APP_VERSION:-$DEPLOYMENT_TAG}"
          if [ -n "$APP_VERSION_RESOLVED" ]; then HELM_META_ARGS="$HELM_META_ARGS --app-version $APP_VERSION_RESOLVED"; fi
          TAG_ARG=""
          if [ -n "$DEPLOYMENT_TAG" ]; then TAG_ARG="-t $DEPLOYMENT_TAG"; fi
          harness-deployment . -d "$DOMAIN" -r "$REGISTRY" -rsn "$REGISTRY_SECRET" -n "$NAMESPACE" -e test $TAG_ARG --write-env --cache-url "$IMAGE_CACHE_URL" --force-build "$FORCE_BUILD" -N $HELM_META_ARGS -i samples
          cat deployment/.env >> "$GITHUB_OUTPUT"
      - name: View helm chart
        run: helm template ./deployment/helm --debug -n "$NAMESPACE"
      - name: Share the deployment with the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: cloudharness-deployment
          path: |
            deployment
            .overrides
          include-hidden-files: true
          if-no-files-found: error
    runs-on: ubuntu-latest
  build-accounts:
    name: Build accounts
    needs:
      - prepare
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Check whether accounts already exists in the registry
        id: check
        env:
          IMAGE: ${{ vars.REGISTRY }}/cloud-harness/accounts:${{ needs.prepare.outputs.ACCOUNTS_TAG }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push accounts
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/cloud-harness/accounts:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/cloud-harness/accounts:buildcache,mode=max
          context: ./applications/accounts
          file: ./applications/accounts/Dockerfile
          build-args: |-
            NOCACHE=${{ github.run_id }}
            KEYCLOAK=quay.io/keycloak/keycloak:26.5
            GOLANG=golang:1.26
            ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
            NODE=node:22-alpine
            PYTHON=python:3.12-slim-trixie
            GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
          tags: |-
            ${{ vars.REGISTRY }}/cloud-harness/accounts:${{ needs.prepare.outputs.ACCOUNTS_TAG }}
            ${{ vars.REGISTRY }}/cloud-harness/accounts:${{ needs.prepare.outputs.branch_tag }}
        if: ${{ steps.check.outputs.exists != 'true' || needs.prepare.outputs.force_build == 'all' || contains(format(',{0},', needs.prepare.outputs.force_build), ',accounts,') }}
    if: ${{ (needs.prepare.outputs.ACCOUNTS_TAG_EXISTS != '1') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
  build-common:
    name: Build common
    needs:
      - prepare
      - build-cloudharness-flask
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Check whether common already exists in the registry
        id: check
        env:
          IMAGE: ${{ vars.REGISTRY }}/cloud-harness/common:${{ needs.prepare.outputs.COMMON_TAG }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push common
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/cloud-harness/common:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/cloud-harness/common:buildcache,mode=max
          context: ./applications/common
          file: ./applications/common/server/Dockerfile
          build-args: |-
            NOCACHE=${{ github.run_id }}
            CLOUDHARNESS_FLASK=${{ vars.REGISTRY }}/cloud-harness/cloudharness-flask:${{ needs.prepare.outputs.CLOUDHARNESS_FLASK_TAG }}
            KEYCLOAK=quay.io/keycloak/keycloak:26.5
            GOLANG=golang:1.26
            ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
            NODE=node:22-alpine
            PYTHON=python:3.12-slim-trixie
            GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
          tags: |-
            ${{ vars.REGISTRY }}/cloud-harness/common:${{ needs.prepare.outputs.COMMON_TAG }}
            ${{ vars.REGISTRY }}/cloud-harness/common:${{ needs.prepare.outputs.branch_tag }}
        if: ${{ steps.check.outputs.exists != 'true' || needs.prepare.outputs.force_build == 'all' || contains(format(',{0},', needs.prepare.outputs.force_build), ',common,') }}
    if: ${{ (needs.prepare.outputs.COMMON_TAG_EXISTS != '1') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
  build-jupyterhub:
    name: Build jupyterhub
    needs:
      - prepare
      - build-cloudharness-base
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Check whether jupyterhub already exists in the registry
        id: check
        env:
          IMAGE: ${{ vars.REGISTRY }}/cloud-harness/jupyterhub:${{ needs.prepare.outputs.JUPYTERHUB_TAG }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push jupyterhub
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/cloud-harness/jupyterhub:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/cloud-harness/jupyterhub:buildcache,mode=max
          context: ./applications/jupyterhub
          file: ./applications/jupyterhub/Dockerfile
          build-args: |-
            NOCACHE=${{ github.run_id }}
            CLOUDHARNESS_BASE=${{ vars.REGISTRY }}/cloud-harness/cloudharness-base:${{ needs.prepare.outputs.CLOUDHARNESS_BASE_TAG }}
            KEYCLOAK=quay.io/keycloak/keycloak:26.5
            GOLANG=golang:1.26
            ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
            NODE=node:22-alpine
            PYTHON=python:3.12-slim-trixie
            GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
          tags: |-
            ${{ vars.REGISTRY }}/cloud-harness/jupyterhub:${{ needs.prepare.outputs.JUPYTERHUB_TAG }}
            ${{ vars.REGISTRY }}/cloud-harness/jupyterhub:${{ needs.prepare.outputs.branch_tag }}
        if: ${{ steps.check.outputs.exists != 'true' || needs.prepare.outputs.force_build == 'all' || contains(format(',{0},', needs.prepare.outputs.force_build), ',jupyterhub,') }}
    if: ${{ (needs.prepare.outputs.JUPYTERHUB_TAG_EXISTS != '1') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
  build-nfsserver:
    name: Build nfsserver
    needs:
      - prepare
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Check whether nfsserver already exists in the registry
        id: check
        env:
          IMAGE: ${{ vars.REGISTRY }}/cloud-harness/nfsserver:${{ needs.prepare.outputs.NFSSERVER_TAG }}
        run: |
