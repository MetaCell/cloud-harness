        env:
          APP_URL: https://hub.${{ vars.DOMAIN }}
          CH_TEST_IMAGE: ${{ vars.REGISTRY }}/cloud-harness/test-e2e:${{ needs.prepare.outputs.TEST_E2E_TAG }}
          CH_TEST_COMMANDS: |
            set -e
            npx puppeteer browsers install chrome
            yarn test
        run: |-
          docker run --rm \
            -e APP_URL \
            -v "$GITHUB_WORKSPACE/applications/jupyterhub/test/e2e:/home/test/__tests__/jupyterhub" \
            -w /home/test \
            "$CH_TEST_IMAGE" sh -c "$CH_TEST_COMMANDS"
    runs-on: ubuntu-latest
  tests-e2e-samples:
    name: E2E tests samples
    needs:
      - prepare
      - wait-deployment
      - build-test-e2e
    if: ${{ (needs.prepare.outputs.skip_tests != 'true') && (!cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.prepare.result == 'success') }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone cloud-harness
        uses: actions/checkout@v4
        with:
          repository: MetaCell/cloud-harness
          ref: ${{ env.CLOUDHARNESS_BRANCH }}
          path: cloud-harness
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare.outputs.registry_host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Run samples E2E tests
        env:
          APP_URL: https://www.${{ vars.DOMAIN }}
          USERNAME: sample@testuser.com
          PASSWORD: test
          CH_TEST_IMAGE: ${{ vars.REGISTRY }}/cloud-harness/test-e2e:${{ needs.prepare.outputs.TEST_E2E_TAG }}
          CH_TEST_COMMANDS: |
            set -e
            npx puppeteer browsers install chrome
            yarn test
        run: |-
          docker run --rm \
            -e APP_URL \
            -e USERNAME \
            -e PASSWORD \
            -v "$GITHUB_WORKSPACE/applications/samples/test/e2e:/home/test/__tests__/samples" \
            -w /home/test \
            "$CH_TEST_IMAGE" sh -c "$CH_TEST_COMMANDS"
    runs-on: ubuntu-latest
  cleanup:
    name: Delete the test deployment
    needs:
      - prepare
      - deploy
      - tests-unit-samples
      - tests-api-common
      - tests-api-samples
      - tests-api-workflows
      - tests-e2e-jupyterhub
      - tests-e2e-samples
    if: ${{ always() && needs.deploy.result == 'success' }}
    env:
      NAMESPACE: ${{ needs.prepare.outputs.namespace }}
      WAIT_ON_FAIL: ${{ vars.WAIT_ON_FAIL || '0' }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
    steps:
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            mkdir -p "$HOME/.kube"
            echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          elif [ -n "$KUBERNETES_SERVICE_HOST" ] || kubectl config current-context > /dev/null 2>&1; then
            echo "Using the runner's ambient cluster access"
          else
            echo "::error::No cluster access: set the KUBECONFIG secret (base64 kubeconfig) where this job can read it, or run on a runner inside the target cluster"
            exit 1
          fi
      - name: Uninstall the release and delete the namespace
        run: |
          if [ "$FAILED" = "true" ] && [ "$WAIT_ON_FAIL" != "0" ]; then
            echo "Tests failed: keeping the deployment for $WAIT_ON_FAIL minutes for inspection"
            sleep $((WAIT_ON_FAIL * 60))
          fi
          helm uninstall "$NAMESPACE" -n "$NAMESPACE" || true
          kubectl delete namespace "$NAMESPACE" --ignore-not-found
    runs-on: ubuntu-latest
