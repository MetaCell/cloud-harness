  deploy:
    name: Deploy
    needs:
      - prepare
      - build-accounts
      - build-common
      - build-jupyterhub
      - build-nfsserver
      - build-samples
      - build-samples-print-file
      - build-samples-sum
      - build-samples-secret
      - build-volumemanager
      - build-workflows
      - build-workflows-notify-queue
      - build-workflows-send-result-event
      - build-workflows-extract-download
      - build-cloudharness-flask
      - build-cloudharness-base
      - build-cloudharness-django
      - build-cloudharness-frontend-build
      - tests-unit-samples
    environment: test
    env:
      HELM_FLAGS: --timeout 200s --create-namespace
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudharness-deployment
          path: .
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            mkdir -p "$HOME/.kube"
            echo "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          elif [ -n "$KUBERNETES_SERVICE_HOST" ] || kubectl config current-context > /dev/null 2>&1; then
            echo "Using the runner's ambient cluster access"
          else
            echo "::error::No cluster access: set the KUBECONFIG secret (base64 kubeconfig) where this job can read it, or run on a runner inside the target cluster"
            exit 1
          fi
      - name: Collect secret values
        env:
          ASECRET: ${{ secrets.ASECRET }}
        run: |
          set -e
          secrets_dir="$RUNNER_TEMP/ch-secrets"
          mkdir -p "$secrets_dir"
          args=""
          printf '%s' "$ASECRET" > "$secrets_dir/0"
          args="$args --set-file apps.samples.harness.secrets.asecret=$secrets_dir/0"
          printf '%s' "$ASECRET" > "$secrets_dir/1"
          args="$args --set-file apps.samples-instance1.harness.secrets.asecret=$secrets_dir/1"
          echo "HELM_SET_ARGS=$args" >> "$GITHUB_ENV"
      - name: Install chart
        env:
          NAMESPACE: ${{ needs.prepare.outputs.namespace }}
        run: helm upgrade --install "$NAMESPACE" deployment/helm -n "$NAMESPACE" $HELM_FLAGS -f deployment/helm/values.yaml $HELM_SET_ARGS
