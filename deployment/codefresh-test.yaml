        - GOLANG=golang:1.26
        - ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
        - SENTRY=sentry:9.1.2
        - PYTHON=python:3.12-slim-trixie
        - NODE=node:22-alpine
        - GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
        when:
          condition:
            any:
              buildDoesNotExist: includes('${{TEST_TAG_EXISTS}}', '{{TEST_TAG_EXISTS}}')
                == true
              forceNoCache: includes('${{TEST_TAG_FORCE_BUILD}}', '{{TEST_TAG_FORCE_BUILD}}')
                == false
      volumemanager:
        title: Building volumemanager
        type: build
        stage: build
        registry: ${{CODEFRESH_REGISTRY}}
        buildkit: true
        image_name: cloud-harness/volumemanager
        working_directory: applications/volumemanager/server
        dockerfile: Dockerfile
        tag: ${{VOLUMEMANAGER_TAG}}
        build_arguments:
        - NOCACHE=${{CF_BUILD_ID}}
        - CLOUDHARNESS_FLASK=${{REGISTRY}}/cloud-harness/cloudharness-flask:${{CLOUDHARNESS_FLASK_TAG}}
        - KEYCLOAK=quay.io/keycloak/keycloak:26.5
        - GOLANG=golang:1.26
        - ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
        - SENTRY=sentry:9.1.2
        - PYTHON=python:3.12-slim-trixie
        - NODE=node:22-alpine
        - GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
        when:
          condition:
            any:
              buildDoesNotExist: includes('${{VOLUMEMANAGER_TAG_EXISTS}}', '{{VOLUMEMANAGER_TAG_EXISTS}}')
                == true
              forceNoCache: includes('${{VOLUMEMANAGER_TAG_FORCE_BUILD}}', '{{VOLUMEMANAGER_TAG_FORCE_BUILD}}')
                == false
      workflows:
        title: Building workflows
        type: build
        stage: build
        registry: ${{CODEFRESH_REGISTRY}}
        buildkit: true
        image_name: cloud-harness/workflows
        working_directory: applications/workflows/server
        dockerfile: Dockerfile
        tag: ${{WORKFLOWS_TAG}}
        build_arguments:
        - NOCACHE=${{CF_BUILD_ID}}
        - CLOUDHARNESS_FLASK=${{REGISTRY}}/cloud-harness/cloudharness-flask:${{CLOUDHARNESS_FLASK_TAG}}
        - KEYCLOAK=quay.io/keycloak/keycloak:26.5
        - GOLANG=golang:1.26
        - ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
        - SENTRY=sentry:9.1.2
        - PYTHON=python:3.12-slim-trixie
        - NODE=node:22-alpine
        - GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
        when:
          condition:
            any:
              buildDoesNotExist: includes('${{WORKFLOWS_TAG_EXISTS}}', '{{WORKFLOWS_TAG_EXISTS}}')
                == true
              forceNoCache: includes('${{WORKFLOWS_TAG_FORCE_BUILD}}', '{{WORKFLOWS_TAG_FORCE_BUILD}}')
                == false
    title: Build parallel step 3
  build_application_images_3:
    type: parallel
    stage: build
    steps:
      samples-sum:
        title: Building samples-sum
        type: build
        stage: build
        registry: ${{CODEFRESH_REGISTRY}}
        buildkit: true
        image_name: cloud-harness/sampleapp-sum
        working_directory: applications/samples/tasks/sum
        dockerfile: Dockerfile
        tag: ${{SAMPLES_SUM_TAG}}
        build_arguments:
        - NOCACHE=${{CF_BUILD_ID}}
        - SAMPLES=${{REGISTRY}}/cloud-harness/sampleapp:${{SAMPLES_TAG}}
        - KEYCLOAK=quay.io/keycloak/keycloak:26.5
        - GOLANG=golang:1.26
        - ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
        - SENTRY=sentry:9.1.2
        - PYTHON=python:3.12-slim-trixie
        - NODE=node:22-alpine
        - GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
        when:
          condition:
            any:
              buildDoesNotExist: includes('${{SAMPLES_SUM_TAG_EXISTS}}', '{{SAMPLES_SUM_TAG_EXISTS}}')
                == true
              forceNoCache: includes('${{SAMPLES_SUM_TAG_FORCE_BUILD}}', '{{SAMPLES_SUM_TAG_FORCE_BUILD}}')
                == false
    title: Build parallel step 4
  build_application_images_4:
    type: parallel
    stage: build
    steps:
      sentry:
        title: Building sentry
        type: build
        stage: build
        registry: ${{CODEFRESH_REGISTRY}}
        buildkit: true
        image_name: cloud-harness/sentry
        working_directory: applications/sentry
        dockerfile: Dockerfile
        tag: ${{SENTRY_TAG}}
        build_arguments:
        - NOCACHE=${{CF_BUILD_ID}}
        - SENTRY=sentry:9.1.2
        - KEYCLOAK=quay.io/keycloak/keycloak:26.5
        - GOLANG=golang:1.26
        - ROCKYLINUX=rockylinux/rockylinux:10.1-minimal
        - PYTHON=python:3.12-slim-trixie
        - NODE=node:22-alpine
        - GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0
        when:
          condition:
            any:
              buildDoesNotExist: includes('${{SENTRY_TAG_EXISTS}}', '{{SENTRY_TAG_EXISTS}}')
                == true
              forceNoCache: includes('${{SENTRY_TAG_FORCE_BUILD}}', '{{SENTRY_TAG_FORCE_BUILD}}')
                == false
    title: Build parallel step 5
  tests_unit:
    stage: unittest
    type: parallel
    steps:
      samples_ut:
        title: Unit tests for samples
        commands:
        - pytest /usr/src/app/samples/test
        image: ${{REGISTRY}}/cloud-harness/sampleapp:${{SAMPLES_TAG}}
  deployment:
    stage: deploy
    type: helm
    working_directory: ./${{CF_REPO_NAME}}
    title: Installing chart
    arguments:
      helm_version: 3.14.4
      chart_name: deployment/helm
      release_name: test-${{NAMESPACE_BASENAME}}
      kube_context: ${{CLUSTER_NAME}}
      namespace: test-${{NAMESPACE_BASENAME}}
      chart_version: ${{CF_SHORT_REVISION}}
      cmd_ps: --timeout 200s --create-namespace
      custom_value_files:
      - ./deployment/helm/values.yaml
      custom_values:
      - apps_notifications_harness_secrets_email-user="${{EMAIL-USER}}"
      - apps_notifications_harness_secrets_email-password="${{EMAIL-PASSWORD}}"
      - apps_samples_harness_secrets_asecret="${{ASECRET}}"
      - apps_samples-instance1_harness_secrets_asecret="${{ASECRET}}"
      - apps_sentry_harness_secrets_email-server="${{EMAIL-SERVER}}"
      - apps_sentry_harness_secrets_email-user="${{EMAIL-USER}}"
      - apps_sentry_harness_secrets_email-password="${{EMAIL-PASSWORD}}"
      - registry_secret_value="${{K8S_SA_JSON}}"
  wait_deployment:
    stage: qa
    title: Wait deployment to be ready
    image: codefresh/kubectl
    timeout: 10m
    commands:
    - kubectl config use-context ${{CLUSTER_NAME}}
    - kubectl config set-context --current --namespace=test-${{NAMESPACE_BASENAME}}
    - kubectl rollout status deployment/accounts
    - kubectl rollout status deployment/argo-gk
    - kubectl rollout status deployment/common
    - kubectl rollout status deployment/es-gk
    - kubectl rollout status deployment/notifications
    - kubectl rollout status statefulset/samples
    - kubectl rollout status deployment/www-gk
    - kubectl rollout status deployment/samples-instance1
    - kubectl rollout status deployment/samples1-gk
    - kubectl rollout status deployment/sentry
    - kubectl rollout status deployment/test
    - kubectl rollout status deployment/volumemanager
    - kubectl rollout status deployment/workflows
    - sleep 60
  tests_nfs_failover:
    stage: qa
    title: NFS server failover & multi-node tests
    image: codefresh/kubectl
    working_directory: .
    fail_fast: false
    commands:
    - kubectl config use-context ${{CLUSTER_NAME}}
    - export NAMESPACE=test-${{NAMESPACE_BASENAME}}
    - export STORAGE_CLASS=${NAMESPACE}-nfs-client
    - bash applications/nfsserver/test/failover-test.sh
    hooks:
      on_finish:
        exec:
          image: codefresh/kubectl
          commands:
          - kubectl config use-context ${{CLUSTER_NAME}}
          - export NAMESPACE=test-${{NAMESPACE_BASENAME}}
          - kubectl -n $NAMESPACE delete pod -l app=nfs-failover-test --ignore-not-found
            --grace-period=0 --force --wait=false 2>/dev/null || true
          - kubectl -n $NAMESPACE delete pvc -l app=nfs-failover-test --ignore-not-found
            --wait=false 2>/dev/null || true
      on_fail:
        exec:
          image: alpine
          commands:
          - cf_export  FAILED=failed
    when:
      condition:
        all:
          nfs_test_enabled: '"${{TEST_NFS_FAILOVER}}" == "true"'
  tests_api:
    stage: qa
    title: Api tests
    working_directory: /home/test
    image: ${{REGISTRY}}/cloud-harness/test-api:${{TEST_API_TAG}}
    fail_fast: false
    commands:
    - echo $APP_NAME
    scale:
      common_api_test:
        title: common api test
        volumes:
        - ${{CF_REPO_NAME}}/applications/common:/home/test
        - ${{CF_REPO_NAME}}/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml
        environment:
        - APP_URL=https://common.${{DOMAIN}}/api
        commands:
        - st --pre-run cloudharness_test.apitest_init run api/openapi.yaml --base-url
          https://common.${{DOMAIN}}/api -c all
      samples_api_test:
        title: samples api test
        volumes:
        - ${{CF_REPO_NAME}}/applications/samples:/home/test
        - ${{CF_REPO_NAME}}/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml
        environment:
        - APP_URL=https://www.${{DOMAIN}}/api
        - USERNAME=sample@testuser.com
        - PASSWORD=test
        commands:
        - st --pre-run cloudharness_test.apitest_init run api/openapi.yaml --base-url
          https://www.${{DOMAIN}}/api -c all --skip-deprecated-operations --exclude-operation-id=submit_sync
          --exclude-operation-id=submit_sync_with_results --exclude-operation-id=error
          --hypothesis-suppress-health-check=too_slow --hypothesis-deadline=180000
          --request-timeout=180000 --hypothesis-max-examples=2 --show-trace --exclude-checks=ignored_auth
        - pytest -v test/api
      test_api_test:
        title: test api test
        volumes:
        - ${{CF_REPO_NAME}}/applications/test:/home/test
        - ${{CF_REPO_NAME}}/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml
        environment:
        - APP_URL=https://test.${{DOMAIN}}/api
        commands:
        - st --pre-run cloudharness_test.apitest_init run api/openapi.yaml --base-url
          https://test.${{DOMAIN}}/api -c all
        - pytest -v test/api
      workflows_api_test:
        title: workflows api test
        volumes:
        - ${{CF_REPO_NAME}}/applications/workflows:/home/test
        - ${{CF_REPO_NAME}}/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml
        environment:
        - APP_URL=https://workflows.${{DOMAIN}}/api
        commands:
        - st --pre-run cloudharness_test.apitest_init run api/openapi.yaml --base-url
          https://workflows.${{DOMAIN}}/api -c all
    hooks:
      on_fail:
        exec:
          image: alpine
          commands:
          - cf_export  FAILED=failed
  tests_e2e:
    stage: qa
    title: End to end tests
    working_directory: /home/test
    image: ${{REGISTRY}}/cloud-harness/test-e2e:${{TEST_E2E_TAG}}
    fail_fast: false
    commands:
    - npx puppeteer browsers install chrome
    - yarn test
    scale:
      jupyterhub_e2e_test:
        title: jupyterhub e2e test
        volumes:
        - ${{CF_REPO_NAME}}/applications/jupyterhub/test/e2e:/home/test/__tests__/jupyterhub
        environment:
        - APP_URL=https://hub.${{DOMAIN}}
      samples_e2e_test:
        title: samples e2e test
        volumes:
        - ${{CF_REPO_NAME}}/applications/samples/test/e2e:/home/test/__tests__/samples
        environment:
        - APP_URL=https://www.${{DOMAIN}}
        - USERNAME=sample@testuser.com
        - PASSWORD=test
    hooks:
      on_fail:
        exec:
          image: alpine
          commands:
          - cf_export  FAILED=failed
  approval:
    type: pending-approval
    stage: qa
    title: Approve anyway and delete deployment
    description: The pipeline will fail after ${{WAIT_ON_FAIL}} minutes
    timeout:
      timeUnit: minutes
      duration: ${{WAIT_ON_FAIL}}
      finalState: denied
    when:
      condition:
        all:
          error: '"${{FAILED}}" == "failed"'
