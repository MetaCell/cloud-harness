        registry: ${{CODEFRESH_REGISTRY}}
        stage: build
        tag: ${{CLOUDHARNESS_FRONTEND_BUILD_TAG}}
        title: Building cloudharness-frontend-build
        type: build
        when:
          condition:
            any: {buildDoesNotExist: 'includes(''${{CLOUDHARNESS_FRONTEND_BUILD_TAG_EXISTS}}'',
                ''{{CLOUDHARNESS_FRONTEND_BUILD_TAG_EXISTS}}'') == true', forceNoCache: 'includes(''${{CLOUDHARNESS_FRONTEND_BUILD_TAG_FORCE_BUILD}}'',
                ''{{CLOUDHARNESS_FRONTEND_BUILD_TAG_FORCE_BUILD}}'') == false'}
        working_directory: cloud-harness
      my-common:
        build_arguments: ['NOCACHE=${{CF_BUILD_ID}}', DEBUG=true, 'GOLANG=golang:1.26',
