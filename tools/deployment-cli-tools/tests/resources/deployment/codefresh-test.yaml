          'GOLANG=golang:1.26', 'ROCKYLINUX=rockylinux/rockylinux:10.1-minimal', 'KEYCLOAK=quay.io/keycloak/keycloak:26.5',
          'NODE=node:22-alpine', 'GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0']
        buildkit: true
        dockerfile: server/Dockerfile
        image_name: ${{REGISTRY}}/testprojectname/volumemanager
        registry: ${{CODEFRESH_REGISTRY}}
        stage: build
        tag: ${{VOLUMEMANAGER_TAG}}
        title: Building volumemanager
        type: build
        when:
          condition:
            any: {buildDoesNotExist: 'includes(''${{VOLUMEMANAGER_TAG_EXISTS}}'',
                ''{{VOLUMEMANAGER_TAG_EXISTS}}'') == true', forceNoCache: 'includes(''${{VOLUMEMANAGER_TAG_FORCE_BUILD}}'',
                ''{{VOLUMEMANAGER_TAG_FORCE_BUILD}}'') == false'}
        working_directory: cloud-harness/applications/volumemanager
      workflows:
        build_arguments: ['NOCACHE=${{CF_BUILD_ID}}', DEBUG=true, 'CLOUDHARNESS_FLASK=${{REGISTRY}}/testprojectname/cloudharness-flask:${{CLOUDHARNESS_FLASK_TAG}}',
          'GOLANG=golang:1.26', 'ROCKYLINUX=rockylinux/rockylinux:10.1-minimal', 'KEYCLOAK=quay.io/keycloak/keycloak:26.5',
          'NODE=node:22-alpine', 'GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0']
        buildkit: true
        dockerfile: server/Dockerfile
        image_name: ${{REGISTRY}}/testprojectname/workflows
        registry: ${{CODEFRESH_REGISTRY}}
        stage: build
        tag: ${{WORKFLOWS_TAG}}
        title: Building workflows
        type: build
        when:
          condition:
            any: {buildDoesNotExist: 'includes(''${{WORKFLOWS_TAG_EXISTS}}'', ''{{WORKFLOWS_TAG_EXISTS}}'')
                == true', forceNoCache: 'includes(''${{WORKFLOWS_TAG_FORCE_BUILD}}'',
                ''{{WORKFLOWS_TAG_FORCE_BUILD}}'') == false'}
        working_directory: cloud-harness/applications/workflows
    title: Build parallel step 3
    type: parallel
  build_application_images_3:
    stage: build
    steps:
      samples-sum:
        build_arguments: ['NOCACHE=${{CF_BUILD_ID}}', DEBUG=true, 'SAMPLES=${{REGISTRY}}/testprojectname/sampleapp:${{SAMPLES_TAG}}',
          'GOLANG=golang:1.26', 'ROCKYLINUX=rockylinux/rockylinux:10.1-minimal', 'KEYCLOAK=quay.io/keycloak/keycloak:26.5',
          'NODE=node:22-alpine', 'GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0']
        buildkit: true
        dockerfile: Dockerfile
        image_name: ${{REGISTRY}}/testprojectname/sampleapp-sum
        registry: ${{CODEFRESH_REGISTRY}}
        stage: build
        tag: ${{SAMPLES_SUM_TAG}}
        title: Building samples-sum
        type: build
        when:
          condition:
            any: {buildDoesNotExist: 'includes(''${{SAMPLES_SUM_TAG_EXISTS}}'', ''{{SAMPLES_SUM_TAG_EXISTS}}'')
                == true', forceNoCache: 'includes(''${{SAMPLES_SUM_TAG_FORCE_BUILD}}'',
                ''{{SAMPLES_SUM_TAG_FORCE_BUILD}}'') == false'}
        working_directory: cloud-harness/applications/samples/tasks/sum
    title: Build parallel step 4
    type: parallel
  deployment:
    arguments:
      chart_name: deployment/helm
      chart_version: ${{CF_SHORT_REVISION}}
      cmd_ps: --timeout 200s --create-namespace
      custom_value_files: [./deployment/helm/values.yaml]
      custom_values: ['apps_myapp-inst1_harness_database_connect__string="${{MYAPP_INST1_DB_CONNECT_STRING}}"',
        'apps_myapp_harness_database_connect__string="${{MYAPP_DB_CONNECT_STRING}}"',
        'apps_samples_harness_secrets_asecret="${{ASECRET}}"', 'apps_samples-instance1_harness_secrets_asecret="${{ASECRET}}"']
      helm_version: 3.14.4
      kube_context: ${{CLUSTER_NAME}}
      namespace: test-${{NAMESPACE_BASENAME}}
      release_name: test-${{NAMESPACE_BASENAME}}
    stage: deploy
    title: Installing chart
    type: helm
    working_directory: ./${{CF_REPO_NAME}}
  main_clone: {git: github, repo: '${{CF_REPO_OWNER}}/${{CF_REPO_NAME}}', revision: '${{CF_BRANCH}}',
    stage: prepare, title: Clone main repository, type: git-clone}
  post_main_clone:
    stage: prepare
    steps:
      clone_b_git_master_myapp: {git: github, repo: 'https://github.com/a/b.git',
        revision: master, title: Cloning b.git repository..., type: git-clone, working_directory: ../applications/myapp/dependencies}
      clone_cloud_harness: {git: github, repo: 'https://github.com/MetaCell/cloud-harness.git',
        revision: '${{CLOUDHARNESS_BRANCH}}', stage: prepare, title: Cloning cloud-harness
          repository..., type: git-clone, working_directory: .}
      clone_d_git_v1_0_0_myapp: {git: github, repo: 'https://github.com/c/d.git',
        revision: v1.0.0, title: Cloning d.git repository..., type: git-clone, working_directory: ../applications/myapp/dependencies/myrepo}
    title: Post main clone
    type: parallel
  prepare_deployment:
    commands: [bash cloud-harness/install.sh, 'export HELM_NAME_ARG="$( [ -n "${{CHART_NAME}}"
        ] && printf -- "--name %s" "${{CHART_NAME}}" )"', 'export HELM_CHART_VERSION_ARG="$(
        [ -n "${{CHART_VERSION}}" ] && printf -- "--chart-version %s" "${{CHART_VERSION}}"
        )"', 'export HELM_APP_VERSION_ARG="$( APP_VERSION_RESOLVED="${{APP_VERSION}}";
        [ -z "$APP_VERSION_RESOLVED" ] && APP_VERSION_RESOLVED="${{DEPLOYMENT_TAG}}";
        [ -n "$APP_VERSION_RESOLVED" ] && printf -- "--app-version %s" "$APP_VERSION_RESOLVED"
        )"', export HELM_META_ARGS="$HELM_NAME_ARG $HELM_CHART_VERSION_ARG $HELM_APP_VERSION_ARG",
      'harness-deployment cloud-harness . -n test-${{NAMESPACE_BASENAME}} -d ${{DOMAIN}}
        -r ${{REGISTRY}} -rsn ${{REGISTRY_SECRET}} -e test --write-env --cache-url
        ''${{IMAGE_CACHE_URL}}'' -N $HELM_META_ARGS -i samples -i myapp', 'cat deployment/.env
        >> ${{CF_VOLUME_PATH}}/env_vars_to_export', 'cat ${{CF_VOLUME_PATH}}/env_vars_to_export']
    image: python:3.12
    stage: prepare
    title: Prepare helm chart
    working_directory: .
  prepare_deployment_view:
    commands: ['helm template ./deployment/helm --debug -n test-${{NAMESPACE_BASENAME}}-${{CF_SHORT_REVISION}}']
    environment: [ACTION=auth, 'KUBE_CONTEXT=test-${{CF_BUILD_ID}}']
    image: codefresh/cfstep-helm:3.14.4
    stage: prepare
    title: View helm chart
  tests_api:
    commands: [echo $APP_NAME]
    fail_fast: false
    hooks:
      on_fail:
        exec:
          commands: [cf_export  FAILED=failed]
          image: alpine
    image: ${{REGISTRY}}/testprojectname/test-api:${{TEST_API_TAG}}
    scale:
      common_api_test:
        commands: ['st --pre-run cloudharness_test.apitest_init run api/openapi.yaml
            --base-url https://common.${{DOMAIN}}/api -c all']
        environment: ['APP_URL=https://common.${{DOMAIN}}/api']
        title: common api test
        volumes: ['${{CF_REPO_NAME}}/../../../../../applications/common:/home/test',
          '${{CF_REPO_NAME}}/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml']
      samples_api_test:
        commands: ['st --pre-run cloudharness_test.apitest_init run api/openapi.yaml
            --base-url https://www.${{DOMAIN}}/api -c all --skip-deprecated-operations
            --exclude-operation-id=submit_sync --exclude-operation-id=submit_sync_with_results
            --exclude-operation-id=error --hypothesis-suppress-health-check=too_slow
            --hypothesis-deadline=180000 --request-timeout=180000 --hypothesis-max-examples=2
            --show-trace --exclude-checks=ignored_auth', pytest -v test/api]
        environment: ['APP_URL=https://www.${{DOMAIN}}/api', USERNAME=sample@testuser.com,
          PASSWORD=test]
        title: samples api test
        volumes: ['${{CF_REPO_NAME}}/../../../../../applications/samples:/home/test',
          '${{CF_REPO_NAME}}/deployment/helm/values.yaml:/opt/cloudharness/resources/allvalues.yaml']
    stage: qa
    title: Api tests
    working_directory: /home/test
  tests_e2e:
    commands: [npx puppeteer browsers install chrome, yarn test]
    fail_fast: false
    hooks:
      on_fail:
        exec:
          commands: [cf_export  FAILED=failed]
          image: alpine
    image: ${{REGISTRY}}/testprojectname/test-e2e:${{TEST_E2E_TAG}}
    scale:
      jupyterhub_e2e_test:
        environment: ['APP_URL=https://hub.${{DOMAIN}}']
        title: jupyterhub e2e test
        volumes: ['${{CF_REPO_NAME}}/../../../../../applications/jupyterhub/test/e2e:/home/test/__tests__/jupyterhub']
      samples_e2e_test:
        environment: ['APP_URL=https://www.${{DOMAIN}}', USERNAME=sample@testuser.com,
          PASSWORD=test]
        title: samples e2e test
        volumes: ['${{CF_REPO_NAME}}/../../../../../applications/samples/test/e2e:/home/test/__tests__/samples']
    stage: qa
    title: End to end tests
    working_directory: /home/test
  tests_nfs_failover:
    commands: ['kubectl config use-context ${{CLUSTER_NAME}}', 'export NAMESPACE=test-${{NAMESPACE_BASENAME}}',
      'export STORAGE_CLASS=${NAMESPACE}-nfs-client', bash applications/nfsserver/test/failover-test.sh]
    fail_fast: false
    hooks:
      on_fail:
        exec:
          commands: [cf_export  FAILED=failed]
          image: alpine
      on_finish:
        exec:
          commands: ['kubectl config use-context ${{CLUSTER_NAME}}', 'export NAMESPACE=test-${{NAMESPACE_BASENAME}}',
            kubectl -n $NAMESPACE delete pod -l app=nfs-failover-test --ignore-not-found
              --grace-period=0 --force --wait=false 2>/dev/null || true, kubectl -n
              $NAMESPACE delete pvc -l app=nfs-failover-test --ignore-not-found --wait=false
              2>/dev/null || true]
          image: codefresh/kubectl
    image: codefresh/kubectl
    stage: qa
    title: NFS server failover & multi-node tests
    when:
      condition:
        all: {nfs_test_enabled: '"${{TEST_NFS_FAILOVER}}" == "true"'}
    working_directory: .
  tests_unit:
    stage: unittest
    steps:
      myapp_ut:
        commands: [tox, echo "hello"]
        image: ${{REGISTRY}}/testprojectname/myapp:${{MYAPP_TAG}}
        title: Unit tests for myapp
      samples_ut:
        commands: [pytest /usr/src/app/samples/test]
        image: ${{REGISTRY}}/testprojectname/sampleapp:${{SAMPLES_TAG}}
        title: Unit tests for samples
    type: parallel
  wait_deployment:
    commands: ['kubectl config use-context ${{CLUSTER_NAME}}', 'kubectl config set-context
        --current --namespace=test-${{NAMESPACE_BASENAME}}', kubectl rollout status
        deployment/argo-gk, kubectl rollout status statefulset/samples, kubectl rollout
        status deployment/www-gk, kubectl rollout status deployment/workflows, kubectl
        rollout status deployment/common, kubectl rollout status deployment/samples-instance1,
      kubectl rollout status deployment/samples1-gk, kubectl rollout status deployment/volumemanager,
      kubectl rollout status deployment/accounts, sleep 60]
    image: codefresh/kubectl
    stage: qa
    timeout: 10m
    title: Wait deployment to be ready
test: true
test_step: test
version: '1.0'
