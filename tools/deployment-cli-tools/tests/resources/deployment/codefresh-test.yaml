stages: [prepare, build, unittest, deploy, qa]
steps:
  approval:
    description: The pipeline will fail after ${{WAIT_ON_FAIL}} minutes
    stage: qa
    timeout: {duration: '${{WAIT_ON_FAIL}}', finalState: denied, timeUnit: minutes}
    title: Approve anyway and delete deployment
    type: pending-approval
    when:
      condition:
        all: {error: '"${{FAILED}}" == "failed"'}
  build_application_images_0:
    stage: build
    steps:
      accounts:
        build_arguments: ['NOCACHE=${{CF_BUILD_ID}}', DEBUG=true, 'GOLANG=golang:1.26',
          'ROCKYLINUX=rockylinux/rockylinux:10.1-minimal', 'KEYCLOAK=quay.io/keycloak/keycloak:26.5',
          'NODE=node:22-alpine', 'GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0']
        buildkit: true
        dockerfile: Dockerfile
        image_name: ${{REGISTRY}}/testprojectname/accounts
        registry: ${{CODEFRESH_REGISTRY}}
        stage: build
        tag: ${{ACCOUNTS_TAG}}
        title: Building accounts
        type: build
        when:
          condition:
            any: {buildDoesNotExist: 'includes(''${{ACCOUNTS_TAG_EXISTS}}'', ''{{ACCOUNTS_TAG_EXISTS}}'')
                == true', forceNoCache: 'includes(''${{ACCOUNTS_TAG_FORCE_BUILD}}'',
                ''{{ACCOUNTS_TAG_FORCE_BUILD}}'') == false'}
        working_directory: cloud-harness/applications/accounts
      cloudharness-base:
        build_arguments: ['NOCACHE=${{CF_BUILD_ID}}', DEBUG=true, 'GOLANG=golang:1.26',
          'ROCKYLINUX=rockylinux/rockylinux:10.1-minimal', 'KEYCLOAK=quay.io/keycloak/keycloak:26.5',
          'NODE=node:22-alpine', 'GATEKEEPER=quay.io/gogatekeeper/gatekeeper:4.6.0']
        buildkit: true
        dockerfile: infrastructure/base-images/cloudharness-base/Dockerfile
        image_name: ${{REGISTRY}}/testprojectname/cloudharness-base
        registry: ${{CODEFRESH_REGISTRY}}
        stage: build
        tag: ${{CLOUDHARNESS_BASE_TAG}}
        title: Building cloudharness-base
        type: build
        when:
          condition:
            any: {buildDoesNotExist: 'includes(''${{CLOUDHARNESS_BASE_TAG_EXISTS}}'',
                ''{{CLOUDHARNESS_BASE_TAG_EXISTS}}'') == true', forceNoCache: 'includes(''${{CLOUDHARNESS_BASE_TAG_FORCE_BUILD}}'',
                ''{{CLOUDHARNESS_BASE_TAG_FORCE_BUILD}}'') == false'}
        working_directory: .overrides/cloudharness-base
