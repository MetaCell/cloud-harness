harness:
  secured: true
  dependencies:
    hard:
    - common
    - accounts
    - events
    build:
    - cloudharness-frontend-build
    - cloudharness-django
  use_services:
    - name: common
  deployment:
    auto: true
    extraContainers:
      run-migrations:
        auto: true
        initContainer: true
        command:
          - python
          - manage.py
          - locked_migrate
        shareVolume: false
  uri_role_mapping:
    - uri: /*
      roles:
        - __APP_NAME__:__APP_NAME__-administrator
        - __APP_NAME__:__APP_NAME__-manager
        - __APP_NAME__:__APP_NAME__-user
      require-any-role: true
